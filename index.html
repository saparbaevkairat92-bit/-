function pdfExtractText(bytes){
  const str=u8str(bytes);
  if(/\/Encrypt\s+\d+\s+\d+\s+R/.test(str)) throw new Error("файл защищён паролем");
  const objs={};
  const re=/(\d+)\s+(\d+)\s+obj\b/g;let m;const marks=[];
  while(m=re.exec(str))marks.push({num:+m[1],bodyStart:re.lastIndex});

    const endObj=str.indexOf("endobj",mk.bodyStart);
    const bodyEnd=endObj<0?str.length:endObj;
    const sIdx=str.indexOf("stream",mk.bodyStart);
    let dict,stream=null;
    if(sIdx>=0&&sIdx<bodyEnd){
      dict=str.slice(mk.bodyStart,sIdx);
      let ds=sIdx+6;if(str[ds]==="\r")ds++;if(str[ds]==="\n")ds++;

      let de=es;if(str[de-1]==="\n")de--;if(str[de-1]==="\r")de--;

    if(!o||!o.stream)return null;let data=o.stream;

      const pm=o.dict.match(/\/Predictor\s+(\d+)/);
      if(pm&&+pm[1]>=10){
        const col=+((o.dict.match(/\/Columns\s+(\d+)/)||[])[1]||1);
        const colors=+((o.dict.match(/\/Colors\s+(\d+)/)||[])[1]||1);
        const bpc=+((o.dict.match(/\/BitsPerComponent\s+(\d+)/)||[])[1]||8);

    }
    return data;
  }
  // object streams (сжатые объекты)
  for(const num in objs){
    const o=objs[num];
    if(/\/Type\s*\/ObjStm/.test(o.dict)){
      try{
        const d=decoded(o);if(!d)continue;const s=u8str(d);
        const N=+((o.dict.match(/\/N\s+(\d+)/)||[])[1]||0);
        const First=+((o.dict.match(/\/First\s+(\d+)/)||[])[1]||0);
        const head=s.slice(0,First).trim().split(/\s+/).map(Number);
        for(let k=0;k<N;k++){
          const onum=head[2*k],off=head[2*k+1];
          const nextOff=(k+1<N)?head[2*k+3]:(s.length-First);
          const objStr=s.slice(First+off,First+nextOff);
          if(objs[onum]===undefined||objs[onum].dict==="")objs[onum]={dict:objStr,stream:null};
        }
      }catch(e){}
    }
  }
  const fontCache={};
  function fontInfo(fnum){
    if(fontCache[fnum])return fontCache[fnum];
    const fo=objs[fnum];let info={two:false,map:null};
    if(fo){
      info.two=/\/Subtype\s*\/Type0/.test(fo.dict)||/\/Identity-H/.test(fo.dict);
      const tu=fo.dict.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
      if(tu){const d=decoded(objs[+tu[1]]);if(d)info.map=parseCMap(u8str(d));}
    }
    return fontCache[fnum]=info;
  }
  function resolveRes(pageObj){
    let cur=pageObj,g=0;
    while(cur&&g++<24){
      const rr=cur.dict.match(/\/Resources\s+(\d+)\s+\d+\s+R/);
      if(rr)return objs[+rr[1]]?objs[+rr[1]].dict:"";
      const inline=extractBalanced(cur.dict,"/Resources","<<",">>");
      if(inline)return inline;
      const par=cur.dict.match(/\/Parent\s+(\d+)\s+\d+\s+R/);
      cur=par?objs[+par[1]]:null;
    }
    return "";
  }
  function parseFonts(resStr){
    const map={};if(!resStr)return map;
    let fontDict=null;
    const fr=resStr.match(/\/Font\s+(\d+)\s+\d+\s+R/);
    if(fr)fontDict=objs[+fr[1]]?objs[+fr[1]].dict:"";
    else fontDict=extractBalanced(resStr,"/Font","<<",">>");
    if(!fontDict)return map;
    const r=/\/([A-Za-z0-9_.\-+]+)\s+(\d+)\s+\d+\s+R/g;let mm;
    while(mm=r.exec(fontDict))map[mm[1]]=fontInfo(+mm[2]);

}

function extractContent(s,fonts){
  let out="",i=0;const n=s.length;let cur=null,stack=[];

    while(i<n&&depth>0){const c=s[i];

      else if(c===")"){depth--;if(depth>0)b.push(41);i++;}

        else if(/[-\d.]/.test(ch)){let num="";while(i<n&&/[-\d.]/.test(s[i])){num+=s[i];i++;}el.push({t:"n",v:parseFloat(num)});continue;}
        else i++;
      }i++;stack.push({t:"arr",v:el});
    }
    else if(c==="/"){i++;let nm="";while(i<n&&!/[\s\/\[\]<>()]/.test(s[i])){nm+=s[i];i++;}stack.push({t:"name",v:nm});}
    else if(/[-\d.]/.test(c)){let num="";while(i<n&&/[-\d.]/.test(s[i])){num+=s[i];i++;}stack.push({t:"n",v:parseFloat(num)});}
    else if(/[A-Za-z'"*]/.test(c)){let op="";while(i<n&&/[A-Za-z0-9'"*]/.test(s[i])){op+=s[i];i++;}

      else if(op==="Td"||op==="TD"||op==="T*"||op==="Tm"){out+="\n";}
      stack=[];
    }
    else i++;
  }
  return out;
}

<script>
"use strict";
/* =====================================================================

function cyrb53(str,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
function pinHash(pin){return cyrb53((S.settings.pinSalt||"")+":"+pin);}

let padState=null;
function padHTML(title,sub,leftLabel){
  const left=leftLabel?`<button data-k="left" class="kx">${leftLabel}</button>`:`<span></span>`;
  return `<div class="padwrap">
    <div class="padlogo"><span class="logo" style="width:46px;height:46px;border-radius:14px"><svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="#04120c" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="14" height="10" rx="3" stroke="#04120c" stroke-width="2"/><circle cx="12" cy="15" r="1.3" fill="#04120c"/></svg></span></div>
    <div class="padtitle">${title}</div>
    <div class="padsub">${sub||""}</div>
    <div class="dots"><span></span><span></span><span></span><span></span></div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
      ${left}
      <button data-k="0">0</button>
      <button data-k="del" class="kx">⌫</button>
    </div>
  </div>`;
}
function mountPad(el,opts){padState={buf:"",opts};el.innerHTML=padHTML(opts.title,opts.sub,opts.leftLabel);el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>padPress(el,b.dataset.k));updateDots(el);}
function updateDots(el){el.querySelectorAll(".dots span").forEach((s,i)=>s.classList.toggle("on",i<padState.buf.length));}
function padPress(el,k){
  if(k==="left"){if(padState.opts.onLeft)padState.opts.onLeft();return;}
  if(k==="del")padState.buf=padState.buf.slice(0,-1);
  else if(/^\d$/.test(k)&&padState.buf.length<4)padState.buf+=k;
  updateDots(el);
  if(padState.buf.length===4){const pin=padState.buf;setTimeout(()=>{if(padState&&padState.opts)padState.opts.onDone(pin);},110);}
}
function padError(el){const d=el.querySelector(".dots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");}try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}padState.buf="";updateDots(el);}

function bootLock(){
  if(!S.settings.pin)return false;
  const el=$("#lock");el.classList.add("on");
  const box=$("#lockbox");
  const left=pinLockLeft();
  const draw=(sub)=>mountPad(box,{title:"Введите пин-код",sub:sub||"Копилка защищена",onDone:(pin)=>{
    if(pinLockLeft()>0){padError(box);drawLock();return;}
    if(pinHash(pin)===S.settings.pin){pinOk();el.classList.remove("on");runPendingLink();}
    else{
      const n=pinFail(); padError(box);
      if(pinLockLeft()>0)drawLock();
      else draw(n>=3?("Неверно · осталось попыток: "+Math.max(0,5-n)):"Неверный пин-код");
    }
  }});
  function drawLock(){
    const t=pinLockLeft();
    draw(t>0?("Слишком много попыток · подожди "+t+" с"):"Копилка защищена");
    if(t>0)setTimeout(drawLock,1000);
  }
  if(left>0)drawLock(); else draw();
  if(S.settings.bioId && window.PublicKeyCredential){
    const b=document.createElement("button");
    b.className="btn ghost";b.style.marginTop="18px";
    b.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="margin-right:6px;vertical-align:-3px"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10a3 3 0 0 1 6 0M8.5 13.5c.5 1.5 1.7 2.5 3.5 2.5M15.5 11v1.5"/></svg>Войти по Face ID';
    b.onclick=()=>tryBio(el,box);
    const w=box.querySelector(".padwrap");if(w)w.appendChild(b);
    setTimeout(()=>tryBio(el,box),350);
  }
  return true;
}
async function tryBio(el,box){const ok=await bioUnlock();if(ok){el.classList.remove("on");runPendingLink();}}
async function bioUnlock(){
  if(!S.settings.bioId||!window.PublicKeyCredential)return false;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const rawId=Uint8Array.from(atob(S.settings.bioId),c=>c.charCodeAt(0));
    const a=await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{type:"public-key",id:rawId}],userVerification:"required",timeout:60000}});
    return !!a;
  }catch(e){return false;}
}
async function enableBio(){
  try{
    if(!window.PublicKeyCredential){toast("Устройство не поддерживает");return;}
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const uid16=crypto.getRandomValues(new Uint8Array(16));
    const cred=await navigator.credentials.create({publicKey:{
      challenge,rp:{name:"Копилка"},user:{id:uid16,name:"kopilka",displayName:"Копилка"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
      timeout:60000,attestation:"none"
    }});
    if(!cred){toast("Отменено");return;}
    S.settings.bioId=btoa(String.fromCharCode.apply(null,new Uint8Array(cred.rawId)));
    save();toast("Face ID включён 🙂");openSettings();
  }catch(e){toast("Не удалось включить Face ID");}
}
function disableBio(){delete S.settings.bioId;save();toast("Face ID отключён");openSettings();}

function themeLabel(){const t=S.settings.theme;return t==="dark"?"Тёмная":t==="light"?"Светлая":"Как в системе";}

function openSettings(){
  const hasPin=!!S.settings.pin;
  openSheet(`
    <h2>Настройки</h2>
    <div class="stat"><span class="k">Тема оформления</span><button class="btn ghost sm" id="stTheme">${themeLabel()}</button></div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
      ${hasPin?`<button class="btn ghost" id="stChange">Изменить пин-код</button>${window.PublicKeyCredential?`<button class="btn ghost" id="stBio">${S.settings.bioId?"🙂 Отключить Face ID / Touch ID":"🙂 Включить Face ID / Touch ID"}</button>`:""}<button class="btn ghost" id="stOff" style="color:var(--exp)">Отключить пин-код</button>`:`<button class="btn" id="stSet">🔒 Установить пин-код</button>`}
    </div>
    <div class="help" style="margin-top:12px">Пин защищает вход и хранится на телефоне в зашифрованном виде. Если забудешь пин — вход можно вернуть только сбросом данных.</div>
    <div style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:10px">
      <button class="btn" id="stLocal">👤 Вход по логину и паролю</button>
      <button class="btn ghost" id="stAcct">☁️ Копия в облаке (нужен сервер)</button>
      <button class="btn ghost" id="stQuick">⚡ Быстрые действия</button>
      <button class="btn ghost" id="stHandoff">🔄 Перенести данные между копиями</button>

<script>
"use strict";
/* =====================================================================
   ЦЕЛИ · БЮДЖЕТЫ · РЕГУЛЯРНЫЕ ПЛАТЕЖИ · РЕЗЕРВНАЯ КОПИЯ
   ===================================================================== */

/* ---------- ЦЕЛИ ---------- */
/* ---------- БЮДЖЕТЫ ---------- */
function openBudgets(){
  const b=S.budgets||{};
  openSheet(`
    <h2>Бюджеты на месяц</h2>
    <div class="help" style="margin-bottom:14px">Задай лимит по категориям. Пустое поле — без лимита.</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      ${EXP_CATS.map(([c,em])=>`
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:130px;font-size:13.5px">${em} ${c}</span>
          <input class="inp num" data-bud="${esc(c)}" type="text" inputmode="numeric" autocomplete="off"
            enterkeyhint="done" placeholder="—" value="${b[c]?fmt(b[c]):""}" style="flex:1;padding:10px">
        </div>`).join("")}
    </div>
    <button class="btn" id="budSave">Сохранить</button>
    <button class="btn ghost" id="budClose" style="margin-top:10px">Отмена</button>
  `);
  document.querySelectorAll("[data-bud]").forEach(i=>i.oninput=()=>i.value=fmtInput(i.value));
  $("#budSave").onclick=()=>{
    const nb={};
    document.querySelectorAll("[data-bud]").forEach(i=>{const v=+i.value.replace(/\D/g,"")||0;if(v)nb[i.dataset.bud]=v;});
    S.budgets=nb;save();closeSheet();render();toast("Бюджеты сохранены");
  };
  $("#budClose").onclick=closeSheet;
}

/* =====================================================================
   ОБЯЗАТЕЛЬНЫЕ ПЛАТЕЖИ  (кредиты, аренда, связь, коммунальные…)

   Логика простая и честная:
     1. У каждого платежа есть период (месяц/неделя/год) и число списания.
        Для каждого периода считается СВОЙ срок — «событие» (occurrence).
     2. Событие считается ОПЛАЧЕННЫМ, если рядом со сроком нашлась подходящая
        операция расхода, либо пользователь отметил вручную.
     3. Складываются только НЕоплаченные обязательные события: просроченные
        плюс те, что наступят в горизонте (по умолчанию 30 дней). Это и есть
        «сколько нужно денег».
     4. «Сколько есть» = свободные деньги + то, что уже лежит в копилке
        «На обязательные платежи» (она — часть отложенного, поэтому её
        прибавляем обратно, чтобы не считать деньги дважды).
     5. Не хватает → считаем нехватку и делим на дни до первого срока,
        который нечем закрыть. Получается «откладывай столько в день».
   ===================================================================== */

/* категории, которые по умолчанию считаются обязательными */
const BILL_LOOKBACK=45;   /* на сколько дней назад ищем просрочку */
const MUST_CATS=["Кредит","Жильё","Коммунальные","Связь","Подписки","Образование","Здоровье"];

function addDaysISO(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function monthEndISO(mk){const y=+mk.slice(0,4),m=+mk.slice(5,7);return mk+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0");}
function billHorizon(){const h=+(S.settings&&S.settings.billHorizon);return h>=7&&h<=90?h:30;}
function billNorm(s){return String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]+/g," ").trim();}
function billWords(s){return billNorm(s).split(" ").filter(w=>w.length>2);}
function billIsMust(r){return r.must===undefined?MUST_CATS.includes(r.category):!!r.must;}
function billPerRu(r){return r.period==="week"?"каждую неделю":r.period==="year"?"каждый год":"каждый месяц";}

/* ---------- периоды ---------- */
function billPeriodKey(r,iso){
  if(r.period==="week"){
    const d=new Date(iso+"T00:00:00");
    d.setDate(d.getDate()-((d.getDay()+6)%7));      /* к понедельнику */
    return "W"+d.toISOString().slice(0,10);
  }
  if(r.period==="year")return iso.slice(0,4);
  return iso.slice(0,7);
}
function billNextKey(r,key,step){
  step=(step===undefined)?1:step;
  if(r.period==="week")return "W"+addDaysISO(key.slice(1),7*step);
  if(r.period==="year")return String(+key+step);
  const d=new Date(+key.slice(0,4),+key.slice(5,7)-1+step,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
/* срок платежа внутри периода */
function billDueIn(r,key){
  if(r.period==="week"){
    let dw=+r.day; if(!isFinite(dw))dw=1;           /* 0 = воскресенье, поэтому не ||1 */
    const dow=Math.min(6,Math.max(0,dw));
    return addDaysISO(key.slice(1),(dow+6)%7);      /* смещение от понедельника */
  }
  if(r.period==="year"){
    const m=Math.min(12,Math.max(1,+r.month||1));
    const last=new Date(+key,m,0).getDate();
    return key+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(Math.max(1,+r.day||1),last)).padStart(2,"0");
  }
  const last=new Date(+key.slice(0,4),+key.slice(5,7),0).getDate();
  return key+"-"+String(Math.min(Math.max(1,+r.day||1),last)).padStart(2,"0");
}
/* ближайший будущий срок — используется в старых местах */
function nextDue(r){
  const t=todayISO();
  let key=billPeriodKey(r,t);
  for(let i=0;i<400;i++){
    const due=billDueIn(r,key);
    if(due>=t)return due;
    key=billNextKey(r,key,1);
  }
  return t;
}

/* ---------- поиск операции, которой платёж уже закрыт ---------- */
function billWindow(r,due){
  const back=r.period==="week"?3:r.period==="year"?20:10;
  const fwd =r.period==="week"?3:r.period==="year"?20:12;
  return[addDaysISO(due,-back),addDaysISO(due,fwd)];
}
function billTxMatch(r,t){
  if(!(txEffect(t).exp>0))return false;                     /* только реальный отток */
  const words=billWords(r.match||r.name);
  const hay=billNorm([t.counterparty,t.merchant,t.note,t.category].filter(Boolean).join(" "));
  if(words.length&&words.every(w=>hay.indexOf(w)>=0))return true;
  if(r.category&&t.category===r.category&&r.amount)
    return Math.abs(t.amount-r.amount)<=Math.max(r.amount*0.2,300);
  return false;
}
function billFindTx(r,due){
  if(r.auto===false)return null;
  const w=billWindow(r,due), t2=todayISO();
  const to=t2<w[1]?t2:w[1];
  let best=null;
  for(const t of S.transactions){
    if(t.date<w[0]||t.date>to)continue;
    if(!billTxMatch(r,t))continue;
    const s=Math.abs(t.amount-(r.amount||0));
    if(!best||s<best.s)best={t,s};
  }
  return best?best.t:null;
}

/* ---------- одно событие платежа ---------- */
function billOcc(r,key){
  const due=billDueIn(r,key), today=todayISO();
  const skipped=!!(r.skip&&r.skip[key]);
  const manual=!!(r.paid&&r.paid[key]);
  const tx=(skipped||manual)?null:billFindTx(r,due);
  const paid=manual||!!tx;
  const status=skipped?"skip":paid?"paid":due<today?"overdue":due===today?"today":"upcoming";
  return{r,key,due,paid,tx,manual,skipped,status,
    amount:tx?tx.amount:(r.amount||0),
    days:daysBetween(today,due),must:billIsMust(r)};
}
/* все события в диапазоне дат */
/* дата, раньше которой платежа не существовало: за неё нечего требовать */
function billSince(r){return r.start||r.created||"";}
function billOccurrences(fromISO,toISO){
  const out=[];
  for(const r of (S.recurring||[])){
    if(r.archived)continue;
    const since=billSince(r);
    let key=billPeriodKey(r,fromISO);
    for(let i=0;i<400;i++){
      const due=billDueIn(r,key);
      if(due>toISO)break;
      /* Платёж, добавленный сегодня, НЕ делает человека должником за прошлые
         месяцы — считаем только начиная с даты появления платежа. */
      if(due>=fromISO&&(!since||due>=since)&&(!r.end||due<=r.end))out.push(billOcc(r,key));
      key=billNextKey(r,key,1);
    }
  }
  return out.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
}

/* ---------- копилка «На обязательные платежи» ---------- */
function billsJar(){return (S.jars||[]).find(j=>j.type==="bills")||null;}
function billsReserve(){const j=billsJar();return j?jarCurrent(j):0;}
function ensureBillsJar(){
  let j=billsJar();
  if(!j){
    j={id:uid(),name:"На обязательные платежи",emoji:"🔒",type:"bills",target:0,due:"",created:todayISO(),moves:[]};
    S.jars.push(j); save();
  }
  return j;
}

/* ---------- главный расчёт ---------- */
/* Просрочки: берём только САМУЮ СВЕЖУЮ неоплаченную по каждому платежу.
   Если платёж не отмечался месяцами, это почти всегда пробел в данных, а не
   долг в тройном размере — раздувать сумму и пугать человека нечестно.
   Более старые периоды считаем отдельно и показываем как повод проверить. */
function billsOverdue(){
  const today=todayISO();
  const all=billOccurrences(addDaysISO(today,-BILL_LOOKBACK),addDaysISO(today,-1))
    .filter(o=>o.must&&o.status==="overdue");
  const last={},stale=[];
  for(const o of all){
    const p=last[o.r.id];
    if(!p||o.due>p.due){ if(p)stale.push(p); last[o.r.id]=o; }
    else stale.push(o);
  }
  return{list:Object.keys(last).map(k=>last[k]).sort((a,b)=>a.due<b.due?-1:1),stale};
}
function billsPlan(days){
  const today=todayISO(), horizon=days||billHorizon();
  const to=addDaysISO(today,horizon);
  const od=billsOverdue(), overdue=od.list;
  const ahead=billOccurrences(today,to)
    .filter(o=>o.must&&o.status!=="paid"&&o.status!=="skip");
  const list=overdue.concat(ahead);
  const need=list.reduce((a,o)=>a+o.amount,0);
  const ms=moneyState(), reserve=billsReserve();
  const have=ms.available+reserve;
  let bal=have, firstShort=null;
  for(const o of list){bal-=o.amount; if(bal<0&&!firstShort)firstShort=o;}
  const deficit=Math.max(0,need-have);
  const deadlineDays=firstShort?Math.max(0,daysBetween(today,firstShort.due)):0;
  const perDay=deficit>0?Math.ceil(deficit/Math.max(1,deadlineDays)):0;
  /* прогресс текущего месяца */
  const mk=curMonth();
  const inMonth=billOccurrences(mk+"-01",monthEndISO(mk)).filter(o=>o.must&&o.status!=="skip");
  const monthSum=inMonth.reduce((a,o)=>a+o.amount,0);
  const paidSum=inMonth.filter(o=>o.status==="paid").reduce((a,o)=>a+o.amount,0);
  return{list,overdue,stale:od.stale,ahead,need,have,reserve,available:ms.available,
    deficit,perDay,firstShort,deadlineDays,horizon,horizonEnd:to,
    monthSum,paidSum,monthLeft:Math.max(0,monthSum-paidSum),
    covered:deficit<=0,after:Math.max(0,ms.available-Math.max(0,need-reserve)),
    coverage:need>0?Math.min(100,Math.round(have/need*100)):100};
}

/* лента: просрочка + весь текущий месяц + горизонт (без повторов) */
function billsFeed(){
  const today=todayISO(), mk=curMonth();
  const a=billOccurrences(addDaysISO(today,-62),addDaysISO(today,-1)).filter(o=>o.status==="overdue");
  const b=billOccurrences(mk+"-01",monthEndISO(mk));
  const c=billOccurrences(today,addDaysISO(today,billHorizon()));
  const seen={},out=[];
  const fresh2=billsOverdue().list.map(o=>o.r.id+"|"+o.key);
  for(const o of a.concat(b,c)){
    const k=o.r.id+"|"+o.key;
    if(seen[k])continue;
    /* устаревшие просрочки в ленту не сыпем — только самую свежую по платежу */
    if(o.status==="overdue"&&fresh2.indexOf(k)<0)continue;
    seen[k]=1; out.push(o);
  }
  return out.sort((x,y)=>x.due<y.due?-1:x.due>y.due?1:0);
}

/* ---------- подсказки: что похоже на регулярный платёж ---------- */
let BILL_SUG=[];
function billSuggestions(){
  const today=todayISO(), from=addDaysISO(today,-190), groups={};
  for(const t of S.transactions){
    if(t.date<from)continue;
    if(!(txEffect(t).exp>0))continue;
    if(t.operationType===OP.TRANSFER_OUT||t.operationType===OP.FEE)continue;
    const name=String(t.counterparty||t.merchant||t.note||"").trim();
    if(name.length<3)continue;
    const key=billWords(name).slice(0,3).join(" ");
    if(!key)continue;
    (groups[key]=groups[key]||{name,items:[]}).items.push(t);
  }
  const have=(S.recurring||[]).map(r=>billWords(r.match||r.name).slice(0,3).join(" "));
  const out=[];
  for(const k in groups){
    if(have.indexOf(k)>=0)continue;
    const g=groups[k];
    const months=Array.from(new Set(g.items.map(t=>monthKey(t.date)))).sort();
    if(months.length<2)continue;                       /* минимум два разных месяца */
    if(months[months.length-1]<monthKey(addDaysISO(today,-62)))continue;  /* не заброшенный */
    const amts=g.items.map(t=>t.amount).sort((a,b)=>a-b);
    const amount=Math.round(amts[Math.floor(amts.length/2)]);
    if(amount<300)continue;
    const days=g.items.map(t=>+t.date.slice(8,10)).sort((a,b)=>a-b);
    const day=days[Math.floor(days.length/2)];
    const last=g.items[g.items.length-1];
    out.push({name:g.name,amount,day,months:months.length,match:k,
      category:last.category,must:MUST_CATS.includes(last.category),
      score:months.length*1e6+amount});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}

/* ---------- ГЛАВНЫЙ ЭКРАН ---------- */
function billsBanner(){
  if(!(S.recurring||[]).length)return "";
  const bp=billsPlan();
  if(bp.overdue.length){
    const o=bp.overdue[0], late=-o.days;
    return `<div class="banner red"><span style="font-size:22px">🔴</span>
      <div class="bt"><b>Просрочен обязательный платёж</b>${esc(o.r.name)} — ${money(o.amount)}, срок был ${ruDateFull(o.due)} (${late} ${plural(late,"день","дня","дней")} назад)${bp.overdue.length>1?` · и ещё ${bp.overdue.length-1}`:""}</div>
      <button class="btn danger sm" data-act="bill-open" data-id="${o.r.id}" data-key="${o.key}">Открыть</button></div>`;
  }
  if(bp.deficit>0){
    const a=billAdvice(bp);
    return `<div class="banner"><span style="font-size:22px">🔒</span>
      <div class="bt"><b>Не хватает на обязательные платежи</b>${a.text}</div>
      <button class="btn gold sm" data-act="bill-reserve">Отложить</button></div>`;
  }
  return "";
}

/* Совет одной фразой. Срок в прошлом — «в день» бессмысленно, нужно сейчас. */
function billAdvice(bp){
  if(bp.covered)return{now:false,text:"Всё закрыто."};
  const due=bp.firstShort.due, today=todayISO();
  if(due<today)return{now:true,
    text:`Нужно найти <b class="r">${money(bp.deficit)}</b> — срок платежа «${esc(bp.firstShort.r.name)}» уже прошёл (${ruDateFull(due)}).`};
  if(due===today)return{now:true,
    text:`Нужно <b class="r">${money(bp.deficit)}</b> уже сегодня — «${esc(bp.firstShort.r.name)}» списывается сегодня.`};
  const d=bp.deadlineDays;
  return{now:false,
    text:`Чтобы закрыть всё вовремя, откладывай <b class="y">${money(bp.perDay)} в день</b> ближайшие ${d} ${plural(d,"день","дня","дней")} — до ${ruDateFull(due)}.`};
}
function billStatusText(o){
  if(o.skipped)return "Пропущено в этом периоде";
  if(o.paid)return (o.tx?"Оплачено "+ruDate(o.tx.date):"Отмечено оплаченным")+" · "+billPerRu(o.r);
  if(o.status==="overdue")return "Просрочено на "+(-o.days)+" "+plural(o.days,"день","дня","дней")+" · было "+ruDateFull(o.due);
  if(o.status==="today")return "Списание сегодня";
  return "Через "+o.days+" "+plural(o.days,"день","дня","дней")+" · "+ruDateFull(o.due);
}
function billRow(o){
  const cls=o.skipped?"":o.paid?"g":o.status==="overdue"?"r":o.status==="today"?"y":"";
  const mark=o.skipped?"⏭":o.paid?"✓":o.status==="overdue"?"⚠️":"";
  return `<div class="row" data-act="bill-open" data-id="${o.r.id}" data-key="${o.key}" style="cursor:pointer">
    <div class="av">${o.r.emoji||EMO[o.r.category]||"📄"}</div>

/* ---------- предупреждения ----------
   Порядок важности: просрочка → срок на носу → денег не хватает. */
function billNotify(){
  if(!(S.recurring||[]).length)return;
  let bp=null; try{bp=billsPlan();}catch(e){return;}
  if(bp.overdue.length){
    const o=bp.overdue[0];
    notifyOnce("recurring","🔴 Просрочен платёж: "+o.r.name,
      money(o.amount)+" — срок был "+ruDateFull(o.due),"over");
  }else{
    for(const o of bp.ahead){
      if(o.days===0){notifyOnce("recurring","📅 Сегодня платёж: "+o.r.name,money(o.amount),"d0");break;}
      if(o.days===1){notifyOnce("recurring","📅 Завтра платёж: "+o.r.name,money(o.amount),"d1");break;}
      if(o.days===3){notifyOnce("recurring","📅 Через 3 дня платёж: "+o.r.name,money(o.amount),"d3");break;}
      if(o.days>3)break;
    }
  }
  if(bp.deficit>0){
    const due=bp.firstShort.due, t=todayISO();
    notifyOnce("bills","🔒 Не хватает на обязательные платежи",
      due<=t ? "Нужно найти "+money(bp.deficit)+" — срок «"+bp.firstShort.r.name+"» уже наступил."
             : "Нужно ещё "+money(bp.deficit)+" к "+ruDateFull(due)+" — это "+money(bp.perDay)+" в день.",
      "gap");
  }
}

      const b=new Blob([json],{type:"application/json"});

      a.download="kopilka-backup-"+todayISO()+".json";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      $("#bkStatus").textContent="Файл сохранён. Если загрузка не началась — скопируй данные из поля ниже.";
    }catch(e){$("#bkStatus").textContent="Скачивание недоступно — скопируй данные из поля ниже.";}
  };
  $("#bkCopy").onclick=async()=>{
    try{await navigator.clipboard.writeText(json);toast("Скопировано");}
    catch(e){const t=$("#bkText");t.removeAttribute("readonly");t.select();document.execCommand("copy");t.setAttribute("readonly","");toast("Скопировано");}
  };
  $("#bkFile").onchange=(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      let data=null;
      try{data=JSON.parse(fr.result);}catch(_){ $("#bkStatus").innerHTML='<span class="r">Файл повреждён — это не копия Копилки.</span>'; return; }
      /* СНАЧАЛА проверяем структуру, только потом заменяем данные */
      if(!data||typeof data!=="object"||!Array.isArray(data.transactions)){
        $("#bkStatus").innerHTML='<span class="r">В файле нет операций — восстановление отменено.</span>';return;
      }
      const n=data.transactions.length, g=(data.jars||data.goals||[]).length, c=(data.challenges||[]).length;
      if(!confirm(`Восстановить копию?\n\nОпераций: ${n}\nЧелленджей: ${c}\nКопилок: ${g}\n\nТекущие данные будут заменены.`))return;
      const backupNow=JSON.stringify(S);
      try{
        S=migrate(Object.assign(fresh(),data));
        save();closeSheet();applyTheme();TAB="home";render();
        celebrate("✅");toast("Восстановлено операций: "+S.transactions.length);
      }catch(err){
        try{S=JSON.parse(backupNow);save();}catch(_){}
        $("#bkStatus").innerHTML='<span class="r">Не удалось восстановить — прежние данные сохранены.</span>';
      }
    };
    fr.readAsText(f);
  };
}

    }catch(e){}
  }
}

<script>
"use strict";
/* =====================================================================
   v3: ИМПОРТ CSV/EXCEL/TXT · УВЕДОМЛЕНИЯ · ЗАЩИТА PIN
   ===================================================================== */

/* ---------- ZIP (для .xlsx) — используем уже готовый inflate ---------- */
function unzip(bytes){
  const files={}; const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  /* ищем central directory с конца */
  let eocd=-1;
  for(let i=bytes.length-22;i>=0&&i>bytes.length-66000;i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0)throw new Error("не ZIP-архив");
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), cmtLen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder("utf-8").decode(bytes.subarray(off+46,off+46+nameLen));
    /* локальный заголовок */
    const lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
    const dataStart=lho+30+lNameLen+lExtraLen;
    const raw=bytes.subarray(dataStart,dataStart+csize);
    try{ files[name]= method===0 ? raw : inflateRaw(raw); }catch(e){}
    off+=46+nameLen+extraLen+cmtLen;
  }
  return files;
}
/* ---------- .xlsx -> строки таблицы ---------- */
function xlsxRows(bytes){
  const f=unzip(bytes);
  const dec=(u)=>u?new TextDecoder("utf-8").decode(u):"";
  const unesc=(x)=>x.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
  /* общая таблица строк */
  const shared=[];
  const ss=dec(f["xl/sharedStrings.xml"]);
  if(ss){const re=/<si>([\s\S]*?)<\/si>/g;let m;
    while(m=re.exec(ss)){let txt="";const tre=/<t[^>]*>([\s\S]*?)<\/t>/g;let t2;
      while(t2=tre.exec(m[1]))txt+=t2[1];shared.push(unesc(txt));}}
  /* первый лист */
  let sheetName=Object.keys(f).find(k=>/^xl\/worksheets\/sheet1\.xml$/.test(k))
    ||Object.keys(f).find(k=>/^xl\/worksheets\/.*\.xml$/.test(k));
  const sh=dec(f[sheetName]); if(!sh)throw new Error("в файле нет листа");
  const rows=[];
  const rre=/<row[^>]*>([\s\S]*?)<\/row>/g; let r;
  while(r=rre.exec(sh)){
    const cells=[]; const cre=/<c([^>]*)>([\s\S]*?)<\/c>|<c([^>]*)\/>/g; let c;
    while(c=cre.exec(r[1])){
      const attrs=c[1]||c[3]||"", body=c[2]||"";
      const ref=(attrs.match(/r="([A-Z]+)\d+"/)||[])[1]||"";
      let col=0; for(const ch of ref)col=col*26+(ch.charCodeAt(0)-64);
      const isStr=/t="s"/.test(attrs), isInline=/t="(inlineStr|str)"/.test(attrs);
      let v=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
      if(isInline||v===undefined){const t3=body.match(/<t[^>]*>([\s\S]*?)<\/t>/);if(t3)v=t3[1];}
      let val=v===undefined?"":(isStr?(shared[+v]||""):unesc(v));
      if(col>0)cells[col-1]=val; else cells.push(val);
    }
    rows.push(Array.from(cells,x=>x===undefined?"":x));
  }
  return rows;
}
/* ---------- CSV / TSV ---------- */
function parseCSVRows(text){
  const first=(text.split(/\r?\n/).find(l=>l.trim())||"");
  const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length
    ? ";" : (first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length ? "\t" : ",";
  const rows=[];let cur=[],val="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){val+='"';i++;} else q=false; } else val+=ch; }
    else if(ch==='"')q=true;
    else if(ch===delim){cur.push(val);val="";}
    else if(ch==="\n"){cur.push(val);rows.push(cur);cur=[];val="";}
    else if(ch!=="\r")val+=ch;
  }
  if(val||cur.length){cur.push(val);rows.push(cur);}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
/* ---------- таблица -> операции ---------- */
function tableToStatement(rows){
  const res={rows:[],meta:{statementId:cyrb53(JSON.stringify(rows).slice(0,4000))}};
  if(!rows.length)return res;
  const norm=(x)=>String(x==null?"":x).replace(/\s+/g," ").trim();
  /* ищем колонки по заголовку */
  let head=-1,ci={date:-1,amount:-1,desc:-1,debit:-1,credit:-1};
  for(let i=0;i<Math.min(12,rows.length);i++){
    const cells=rows[i].map(x=>norm(x).toLowerCase());
    const find=(...w)=>cells.findIndex(c=>w.some(x=>c.includes(x)));
    const d=find("дата","date","күні"), a=find("сумма","amount","сомасы");
    if(d>=0&&(a>=0||find("расход","дебет","debit")>=0)){
      head=i; ci.date=d; ci.amount=a;
      ci.desc=find("описание","детали","назначение","операц","description","comment","получател","контрагент");
      ci.debit=find("расход","дебет","debit","списание");
      ci.credit=find("приход","кредит","credit","пополнен","зачислен");
      break;
    }
  }
  const parseAmt=(x)=>{
    let v=norm(x).replace(/[^\d,.\-+]/g,"").replace(/\s/g,"");
    if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,"").replace(",",".");
    else v=v.replace(/,/g,"");
    const n=parseFloat(v); return isFinite(n)?n:NaN;
  };
  const parseDate=(x)=>{
    const t=norm(x);
    let m=t.match(/(\d{2})[.\/-](\d{2})[.\/-](\d{2,4})/);
    if(m){let y=m[3];if(y.length===2)y="20"+y;return y+"-"+m[2]+"-"+m[1];}
    m=t.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
    return null;
  };
  const start=head>=0?head+1:0;
  for(let i=start;i<rows.length;i++){
    const row=rows[i]; if(!row||!row.length)continue;
    let date=null,amt=NaN,desc="";
    if(head>=0){
      date=parseDate(row[ci.date]);
      if(ci.amount>=0)amt=parseAmt(row[ci.amount]);
      if(!isFinite(amt)&&ci.debit>=0){const d=parseAmt(row[ci.debit]);if(isFinite(d)&&d)amt=-Math.abs(d);}
      if(!isFinite(amt)&&ci.credit>=0){const c=parseAmt(row[ci.credit]);if(isFinite(c)&&c)amt=Math.abs(c);}
      desc=ci.desc>=0?norm(row[ci.desc]):row.filter((_,k)=>k!==ci.date&&k!==ci.amount).map(norm).join(" ");
    }else{
      /* без заголовка: ищем в строке дату и число */
      for(const cell of row){if(!date)date=parseDate(cell);}
      const nums=row.map(parseAmt).filter(n=>isFinite(n)&&Math.abs(n)>0);
      if(nums.length)amt=nums[nums.length-1];
      desc=row.map(norm).filter(x=>x&&!parseDate(x)).join(" ");
    }
    if(!date||!isFinite(amt)||!amt)continue;
    const dir=amt>0?1:-1, amount=Math.round(Math.abs(amt));
    if(amount>50000000)continue;
    const cl=classifyOp(desc,dir);
    const cat=guessCat(desc,cl.type,cl.operationType,cl.counterparty);
    const r={date,time:"",dir,amount,type:cl.type,operationType:cl.operationType,
      counterparty:cl.counterparty,counterpartyType:cl.counterpartyType,merchant:cl.merchant,
      account:cl.account,rawDescription:desc.slice(0,140),cat,on:true,
      statementId:res.meta.statementId,source:"import"};
    r.fingerprint=fingerprintOf(r);
    res.rows.push(r);
  }
  res.rows.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const have=new Set(S.transactions.map(x=>x.fingerprint));
  const seen={};
  for(const r of res.rows){
    const n=(seen[r.fingerprint]=(seen[r.fingerprint]||0)+1);
    r.dup=have.has(r.fingerprint)&&n<=countTxWithFp(r.fingerprint);
    if(r.dup)r.on=false;
  }
  if(res.rows.length){res.meta.from=res.rows[res.rows.length-1].date;res.meta.to=res.rows[0].date;}
  return res;
}

/* ---------- ЗАЩИТА PIN: блокировка после неудачных попыток ---------- */
function pinFails(){return +(localStorage.getItem("pin_fails")||0);}
function pinLockedUntil(){return +(localStorage.getItem("pin_lock")||0);}
function pinLockLeft(){return Math.max(0,Math.ceil((pinLockedUntil()-Date.now())/1000));}
function pinFail(){
  const n=pinFails()+1;
  localStorage.setItem("pin_fails",String(n));
  if(n>=5){
    const wait=Math.min(300,30*Math.pow(2,n-5));   /* 30с, 60с, 120с … до 5 минут */
    localStorage.setItem("pin_lock",String(Date.now()+wait*1000));
  }
  return n;
}
function pinOk(){localStorage.removeItem("pin_fails");localStorage.removeItem("pin_lock");}

<script>
"use strict";
/* =====================================================================
   PUSH-УВЕДОМЛЕНИЯ (Web Push + service worker)
   Приватность: на сервер уходит только подписка браузера.
   Финансовые данные НЕ передаются — текст уведомления собирает
   service worker на телефоне из локальной базы (см. sw.js).
   ===================================================================== */
function pushCfg(){
  const base=(window.PUSH_CONFIG||{});
  let ov={};
  try{ov=JSON.parse(localStorage.getItem("push_cfg")||"{}");}catch(e){}
  return{serverUrl:(ov.serverUrl||base.serverUrl||"").replace(/\/+$/,""),
         vapidPublicKey:ov.vapidPublicKey||base.vapidPublicKey||""};
}
function pushConfigured(){const c=pushCfg();return !!(c.serverUrl&&c.vapidPublicKey);}
function pushSupported(){return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;}
/* iOS присылает push только установленному на экран «Домой» приложению */
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
function b64ToU8(b64){
  const pad="=".repeat((4-b64.length%4)%4);
  const s2=(b64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(s2); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}

/* ---------- регистрация service worker ---------- */
let SWREG=null;
async function registerSW(){
  if(!("serviceWorker" in navigator))return null;
  try{
    SWREG=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
    return SWREG;
  }catch(e){return null;}
}
async function getReg(){
  if(SWREG)return SWREG;
  if(!("serviceWorker" in navigator))return null;
  try{SWREG=await navigator.serviceWorker.ready;}catch(e){SWREG=null;}
  return SWREG;
}

/* ---------- локальная сводка для уведомлений (в IndexedDB) ---------- */
function idbPut(key,val){
  return new Promise((res)=>{
    try{
      const req=indexedDB.open("kopilka",1);
      req.onupgradeneeded=()=>{try{req.result.createObjectStore("meta");}catch(e){}};
      req.onerror=()=>res(false);
      req.onsuccess=()=>{
        try{
          const db=req.result;
          if(!db.objectStoreNames.contains("meta"))return res(false);
          const tx=db.transaction("meta","readwrite");
          tx.objectStore("meta").put(val,key);
          tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
        }catch(e){res(false);}
      };
    }catch(e){res(false);}
  });
}

/* ---------- подписка / отписка ---------- */
async function pushSubscribe(){
  const cfg=pushCfg();
  if(!pushSupported())throw new Error("браузер не поддерживает push");
  if(!cfg.serverUrl||!cfg.vapidPublicKey)throw new Error("не настроен сервер уведомлений");
  if(isIOS()&&!isStandalone())throw new Error("на iPhone сначала добавь приложение на экран «Домой»");
  const perm=await Notification.requestPermission();
  if(perm!=="granted")throw new Error("разрешение на уведомления не выдано");
  const reg=await registerSW()||await getReg();
  if(!reg)throw new Error("не удалось запустить service worker");
  await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,
    applicationServerKey:b64ToU8(cfg.vapidPublicKey)});
  const res=await fetch(cfg.serverUrl+"/subscribe",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({subscription:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||""})});
  if(!res.ok)throw new Error("сервер не принял подписку ("+res.status+")");
  S.settings.pushOn=true; save(); syncSummary();
  return true;
}
async function pushUnsubscribe(){
  const cfg=pushCfg();
  const reg=await getReg();
  const sub=reg&&await reg.pushManager.getSubscription();
  if(sub){
    if(cfg.serverUrl)try{await fetch(cfg.serverUrl+"/unsubscribe",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})});}catch(e){}
    try{await sub.unsubscribe();}catch(e){}
  }
  S.settings.pushOn=false; save();
  return true;
}
async function pushTest(){
  const cfg=pushCfg();
  const reg=await getReg();
  const sub=reg&&await reg.pushManager.getSubscription();
  if(!sub)throw new Error("сначала включи уведомления");
  const res=await fetch(cfg.serverUrl+"/test",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(j.error||("сервер ответил "+res.status));
  return true;
}
async function pushStatus(){
  const cfg=pushCfg();
  const out={supported:pushSupported(),configured:!!(cfg.serverUrl&&cfg.vapidPublicKey),
    standalone:isStandalone(),ios:isIOS(),
    perm:("Notification" in window)?Notification.permission:"unsupported",subscribed:false};

<script>
"use strict";
/* =====================================================================
   БЫСТРЫЕ ДЕЙСТВИЯ / ССЫЛКИ
   Приложение открывается сразу на нужном экране по ссылке:
     #expense · #income · #transfer · #cash · #jar · #goal
     #add · #import · #report · #ops · #stats · #save
   Это работает с «Касанием задней панели» iPhone, Быстрыми командами,
   виджетами, ярлыками на экране и кликом по уведомлению.
   ===================================================================== */
const DEEP_LINKS={
  add:        {t:"Меню добавления",   run:()=>openAddMenu()},
  expense:    {t:"Добавить расход",   run:()=>openTx("expense")},
  income:     {t:"Добавить доход",    run:()=>openTx("income")},
  transfer:   {t:"Добавить перевод",  run:()=>openTransferSheet()},
  cash:       {t:"Наличные",          run:()=>openCashSheet()},
  jar:        {t:"Пополнить копилку", run:()=>jarMove(ensureJar().id,"in")},
  goal:       {t:"Создать цель",      run:()=>openJar()},
  bills:      {t:"Обязательные платежи",run:()=>{TAB="home";render();openRecurring();}},
  import:     {t:"Загрузить выписку", run:()=>{TAB="ops";render();openImport();}},
  report:     {t:"Отчёт за неделю",   run:()=>openWeeklyReport()},
  score:      {t:"Финансовый рейтинг",run:()=>openScore()},
  ops:        {t:"Операции",          run:()=>{TAB="ops";render();}},
  stats:      {t:"Аналитика",         run:()=>{TAB="stats";render();}},
  save:       {t:"Копилки",           run:()=>{TAB="save";render();}},
  home:       {t:"Главная",           run:()=>{TAB="home";render();}}
};
let PENDING_LINK=null;

function normLink(v){
  let h=(v||"").replace(/^[#?]/,"").trim().toLowerCase();
  if(!h)return "";
  h=h.replace(/^add-/,"");                 /* #add-expense == #expense */
  return DEEP_LINKS[h]?h:"";
}
/* ссылка из хэша: #expense — одноразовая, стирается после срабатывания */
function linkKey(){return normLink(location.hash);}
/* ссылка из параметра: ?add=expense — постоянная, сохраняется в иконке
   на экране «Домой», поэтому такая иконка всегда открывает нужный экран */
/* Была ли эта копия установлена по ссылке ?add=… — на iPhone такая иконка
   получает СВОЁ хранилище, поэтому данные в ней отдельные. */
function installedFromLink(){
  try{
    if(localStorage.getItem("kopilka_clip")==="1")return true;
    const p=new URLSearchParams(location.search);
    if(p.get("add")||p.get("a")){
      if(isStandalone())localStorage.setItem("kopilka_clip","1");
      return true;
    }
  }catch(e){}
  return false;
}
function isSeparateCopy(){
  return isIOS()&&isStandalone()&&installedFromLink();
}
function paramKey(){
  try{const p=new URLSearchParams(location.search);
    return normLink(p.get("add")||p.get("a")||"");}catch(e){return "";}
}
/* Разбираем ссылку. Если стоит пин-код — выполним сразу после разблокировки.
   fromBoot=true только при первом запуске: параметр ?add= срабатывает один раз
   за запуск, иначе экран открывался бы снова при каждом возврате из фона. */
function handleDeepLink(fromBoot){
  let k=linkKey();
  if(k){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
  else if(fromBoot===true)k=paramKey();      /* хэш пуст — смотрим параметр */
  if(!k)return false;
  const locked=$("#lock")&&$("#lock").classList.contains("on");
  if(locked){PENDING_LINK=k;return true;}
  runDeepLink(k);
  return true;
}
function runDeepLink(k){
  const d=DEEP_LINKS[k]; if(!d)return;
  /* приветственное окно не должно перекрывать быстрое действие */
  if(!S.seen){S.seen=true;save();}
  closeSheet();
  setTimeout(()=>{try{d.run();}catch(e){toast("Не удалось открыть: "+k);}},60);
}
function runPendingLink(){
  if(!PENDING_LINK)return;
  const k=PENDING_LINK; PENDING_LINK=null;
  setTimeout(()=>runDeepLink(k),250);
}
window.addEventListener("hashchange",()=>handleDeepLink(false));
/* приложение вернули из фона по ссылке */
document.addEventListener("visibilitychange",()=>{if(!document.hidden){handleDeepLink(false);try{if(isLoggedIn())syncNow(true);}catch(e){}}});

/* ---------- экран «Быстрые действия» ---------- */

  const st=$("#qaStatus");

/* =====================================================================
   ПЕРЕНОС ДАННЫХ МЕЖДУ ДВУМЯ КОПИЯМИ НА ОДНОМ ТЕЛЕФОНЕ
   На iPhone каждая иконка с экрана «Домой» — отдельное приложение со своим
   хранилищем, поэтому данные между ними не общие. Сервер для переноса не
   нужен: буфер обмена на iOS общий для всех приложений. Копируем код в
   одной копии — вставляем в другой.
   ===================================================================== */
const HANDOFF_PREFIX="KOPILKA1:";

function u8ToB64(u8){
  let s2="";const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH)s2+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(s2);
}
function b64ToU8x(b64){
  const raw=atob(b64.replace(/\s+/g,""));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
async function makeHandoffCode(){
  const json=JSON.stringify(S);
  const bytes=new TextEncoder().encode(json);
  /* сжимаем, если браузер умеет — код получается в несколько раз короче */
  if(typeof CompressionStream==="function"){
    try{
      const cs=new CompressionStream("gzip");
      const buf=await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
      return HANDOFF_PREFIX+"z"+u8ToB64(new Uint8Array(buf));
    }catch(e){}
  }
  return HANDOFF_PREFIX+"p"+u8ToB64(bytes);
}
async function readHandoffCode(code){
  const t=String(code||"").trim();
  if(t.indexOf(HANDOFF_PREFIX)!==0)throw new Error("это не код переноса");
  const mode=t.charAt(HANDOFF_PREFIX.length);
  const body=t.slice(HANDOFF_PREFIX.length+1);
  let bytes;
  try{bytes=b64ToU8x(body);}catch(e){throw new Error("код повреждён — скопируй его целиком");}
  if(mode==="z"){
    if(typeof DecompressionStream!=="function")throw new Error("браузер не умеет распаковать этот код");
    const ds=new DecompressionStream("gzip");
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    bytes=new Uint8Array(buf);
  }else if(mode!=="p")throw new Error("неизвестная версия кода");
  let data;
  try{data=JSON.parse(new TextDecoder().decode(bytes));}catch(e){throw new Error("код повреждён");}
  if(!data||!Array.isArray(data.transactions))throw new Error("в коде нет данных Копилки");
  return data;
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true;}
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(_){}
    ta.remove();return ok;
  }
}

function openHandoff(){
  const t=totals(S.transactions);
  openSheet(`
    <h2>🔄 Перенести данные</h2>
    <div class="help" style="margin-bottom:14px">Между двумя иконками на одном телефоне данные не общие — у каждой своё хранилище. Перенести можно через буфер обмена: скопируй код здесь и вставь в другой копии. Файлы и интернет не нужны.</div>
    <div class="card" style="padding:14px;margin-bottom:14px">
      <div class="stat"><span class="k">Операций</span><span class="v">${S.transactions.length}</span></div>
      <div class="stat"><span class="k">Копилок</span><span class="v">${(S.jars||[]).length}</span></div>
      <div class="stat"><span class="k">Обязательных платежей</span><span class="v">${(S.recurring||[]).length}</span></div>
      <div class="stat"><span class="k">Всего денег</span><span class="v">${money(moneyState().total)}</span></div>
    </div>
    <div class="section-title" style="margin-top:0">Отсюда — в другую копию</div>
    <button class="btn gold" id="hoCopy">📤 Скопировать код этой копии</button>
    <div class="help" style="margin-top:8px">Потом открой вторую иконку → Настройки → «Перенести данные» → «Вставить код».</div>

    <div class="section-title">Сюда — из другой копии</div>
    <div class="field"><label>Код переноса</label>
      <textarea class="inp" id="hoIn" rows="3" placeholder="KOPILKA1:…" style="resize:vertical;font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
    <button class="btn ghost" id="hoPaste">📋 Вставить из буфера</button>
    <button class="btn" id="hoApply" style="margin-top:10px">📥 Заменить данные этой копии</button>
    <div class="help" style="margin-top:8px">Данные этой копии будут заменены целиком. Перед заменой она сохранит свой код в буфер — на случай если передумаешь.</div>
    <div id="hoStatus" class="help" style="margin-top:12px;min-height:18px"></div>
    <button class="btn ghost" id="hoClose" style="margin-top:12px">Закрыть</button>
  `);
  const st=$("#hoStatus");
  $("#hoCopy").onclick=async()=>{
    st.textContent="Готовлю код…";
    try{
      const code=await makeHandoffCode();
      const ok=await copyText(code);
      st.innerHTML=ok
        ? '<span class="g">Код скопирован ('+Math.round(code.length/1024)+' КБ). Открой вторую иконку и вставь его там.</span>'
        : '<span class="r">Не удалось скопировать. Выдели код вручную ниже.</span>';
      if(!ok)$("#hoIn").value=code;
    }catch(e){st.innerHTML='<span class="r">'+esc(e.message||String(e))+'</span>';}
  };
  $("#hoPaste").onclick=async()=>{
    try{
      const txt=await navigator.clipboard.readText();
      $("#hoIn").value=txt;
      st.innerHTML='<span class="g">Вставлено. Теперь нажми «Заменить данные».</span>';
    }catch(e){st.innerHTML='<span class="r">Браузер не дал доступ к буферу — вставь код в поле вручную (долгое нажатие → «Вставить»).</span>';}
  };
  $("#hoApply").onclick=async()=>{
    const txt=$("#hoIn").value;
    if(!txt.trim()){st.innerHTML='<span class="r">Сначала вставь код.</span>';return;}
    st.textContent="Проверяю код…";
    let data;
    try{data=await readHandoffCode(txt);}
    catch(e){st.innerHTML='<span class="r">'+esc(e.message||String(e))+'</span>';return;}
    const n=data.transactions.length;
    if(!confirm("Заменить данные этой копии на "+n+" операций из кода? Текущие данные этой копии будут стёрты."))
      {st.textContent="Отменено.";return;}
    try{const back=await makeHandoffCode();await copyText(back);}catch(e){}
    S=migrate(Object.assign(fresh(),data));
    save();closeSheet();render();
    celebrate("🔄");
    toast("Перенесено: "+n+" "+plural(n,"операция","операции","операций"));
  };
  $("#hoClose").onclick=closeSheet;
}

        <b style="color:var(--txt)">3.</b> В основной иконке включи <b style="color:var(--txt)">Настройки → ⚡ Быстрые действия → «Открывать сразу ввод расхода»</b>.<br>
        <b style="color:var(--txt)">4.</b> В «Быстрых командах» сделай команду с действием <b style="color:var(--txt)">«Открыть приложение» → Копилка</b> (не «Открыть URL»).<br>
        <b style="color:var(--txt)">5.</b> Повесь её на «Касание задней панели».
      </div>

    <button class="btn gold" id="scQa">⚡ Открыть быстрые действия</button>

<script>
"use strict";
/* =====================================================================
   АККАУНТ И ОБЛАЧНАЯ КОПИЯ
   Данные шифруются НА ТЕЛЕФОНЕ (AES-GCM). Ключ выводится из пароля
   и никогда не отправляется. Сервер хранит нечитаемый блок байтов.
   Пароль тоже не уходит: отправляется производный ключ, от него на
   сервере хранится ещё один хэш.
   ===================================================================== */
const ACCT_KEY="kopilka_acct";
let ACCT=null;          /* {login, token, version, lastSync, key(base64)} */
let ENCKEY=null;        /* CryptoKey в памяти */

function acctLoad(){
  try{ACCT=JSON.parse(localStorage.getItem(ACCT_KEY)||"null");}catch(e){ACCT=null;}
  return ACCT;
}
function acctSave(){try{localStorage.setItem(ACCT_KEY,JSON.stringify(ACCT));}catch(e){}}
function acctClear(){ACCT=null;ENCKEY=null;try{localStorage.removeItem(ACCT_KEY);}catch(e){}}
function isLoggedIn(){return !!(ACCT&&ACCT.token&&ACCT.login);}
function syncUrl(){return (pushCfg().serverUrl||"").replace(/\/+$/,"");}

/* ---------- вывод ключей из пароля ---------- */
function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));}
function unb64(str){const r=atob(str);const u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function hex(buf){return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,"0")).join("");}
async function deriveKeys(login,password){
  const enc=new TextEncoder();
  const salt=await crypto.subtle.digest("SHA-256",enc.encode("kopilka:"+String(login).trim().toLowerCase()));
  const base=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveBits"]);
  /* 64 байта: первые 32 — ключ шифрования, вторые 32 — ключ входа */
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,512);
  const raw=new Uint8Array(bits);
  return{encRaw:raw.slice(0,32), authKey:hex(raw.slice(32,64))};
}
async function importEncKey(raw){
  return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
}
async function ensureKey(){
  if(ENCKEY)return ENCKEY;
  if(ACCT&&ACCT.key){ENCKEY=await importEncKey(unb64(ACCT.key));return ENCKEY;}
  return null;
}
async function encryptBlob(obj){
  const key=await ensureKey(); if(!key)throw new Error("нет ключа шифрования");
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);
  const out=new Uint8Array(iv.length+ct.byteLength);
  out.set(iv,0); out.set(new Uint8Array(ct),iv.length);
  return b64(out);
}
async function decryptBlob(str){
  const key=await ensureKey(); if(!key)throw new Error("нет ключа шифрования");
  const all=unb64(str);
  const ct=await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},key,all.slice(12));
  return JSON.parse(new TextDecoder().decode(ct));
}

/* ---------- сеть ---------- */
async function api(path,opts){
  const base=syncUrl();
  if(!base)throw new Error("не указан адрес сервера");
  const o=Object.assign({headers:{}},opts||{});
  o.headers["Content-Type"]="application/json";
  if(ACCT&&ACCT.token)o.headers["Authorization"]="Bearer "+ACCT.token;
  const res=await fetch(base+path,o);
  let j={}; try{j=await res.json();}catch(_){}
  if(!res.ok){const e=new Error(j.error||("сервер ответил "+res.status));e.status=res.status;e.data=j;throw e;}
  return j;
}

/* ---------- СЛИЯНИЕ данных двух устройств ---------- */
function mergeById(a,b,deleted){
  const m=new Map();
  for(const x of (a||[]))if(x&&x.id)m.set(x.id,x);
  for(const x of (b||[]))if(x&&x.id&&!m.has(x.id))m.set(x.id,x);
  const out=[];
  for(const [id,x] of m)if(!deleted[id])out.push(x);
  return out;
}
/* копилки: объединяем и сами взносы внутри каждой копилки */
function mergeJars(a,b,deleted){
  const m=new Map();
  for(const j of (a||[]))if(j&&j.id)m.set(j.id,Object.assign({},j,{moves:(j.moves||[]).slice()}));
  for(const j of (b||[])){
    if(!j||!j.id)continue;
    const cur=m.get(j.id);
    if(!cur){m.set(j.id,Object.assign({},j,{moves:(j.moves||[]).slice()}));continue;}
    const seen=new Set(cur.moves.map(x=>x.id));
    for(const mv of (j.moves||[]))if(mv&&mv.id&&!seen.has(mv.id))cur.moves.push(mv);
  }
  const out=[];
  for(const [id,j] of m){
    if(deleted[id])continue;
    j.moves=(j.moves||[]).filter(mv=>!deleted[mv.id]);
    out.push(j);
  }
  return out;
}
/* Слияние: ничего не теряем. Удалённое помним по «надгробиям», иначе
   удалённые операции вернулись бы с другого устройства. */
function mergeStates(local,remote){
  const del=Object.assign({},remote.deleted||{},local.deleted||{});
  const newer=(local.updatedAt||0)>=(remote.updatedAt||0)?local:remote;
  const out=Object.assign({},newer);
  out.transactions=mergeById(local.transactions,remote.transactions,del);
  out.jars=mergeJars(local.jars,remote.jars,del);
  out.challenges=mergeById(local.challenges,remote.challenges,del);
  out.deposits=mergeById(local.deposits,remote.deposits,del);
  out.loans=mergeById(local.loans,remote.loans,del);
  out.recurring=mergeById(local.recurring,remote.recurring,del);
  out.statements=mergeById(local.statements,remote.statements,del);
  out.achievements=Object.assign({},remote.achievements||{},local.achievements||{});
  out.budgets=Object.assign({},remote.budgets||{},local.budgets||{});
  out.rules={
    merchant:Object.assign({},(remote.rules||{}).merchant,(local.rules||{}).merchant),
    counterparty:Object.assign({},(remote.rules||{}).counterparty,(local.rules||{}).counterparty),
    category:Object.assign({},(remote.rules||{}).category,(local.rules||{}).category)
  };
  out.settings=Object.assign({},remote.settings||{},local.settings||{});
  out.deleted=del;
  out.updatedAt=Math.max(local.updatedAt||0,remote.updatedAt||0);
  out.transactions.sort((x,y)=>(y.ts||0)-(x.ts||0));
  return out;
}
/* пометить удалённое, чтобы оно не вернулось при синхронизации */
function markDeleted(id){
  if(!id)return;
  S.deleted=S.deleted||{};
  S.deleted[id]=Date.now();
  const cut=Date.now()-180*864e5;          /* надгробия старше полугода не нужны */
  for(const k in S.deleted)if(S.deleted[k]<cut)delete S.deleted[k];
}

/* ---------- операции синхронизации ---------- */
let SYNCING=false, _cloudT=null;
function syncState(){
  if(!isLoggedIn())return "off";
  if(SYNCING)return "sync";
  if(!ACCT.lastSync)return "never";
  return "ok";
}
async function syncNow(silent){
  if(!isLoggedIn())return false;
  if(SYNCING)return false;
  SYNCING=true; updateSyncBadge();
  try{
    const remote=await api("/sync/pull",{method:"GET"});
    let merged=S;
    if(remote.blob){
      let rs=null;
      try{rs=await decryptBlob(remote.blob);}
      catch(e){throw new Error("не удалось расшифровать облачную копию — другой пароль?");}
      merged=mergeStates(S,migrate(Object.assign(fresh(),rs)));
    }
    S=migrate(Object.assign(fresh(),merged));
    S.updatedAt=Date.now();
    save();
    const blob=await encryptBlob(S);
    let res;
    try{
      res=await api("/sync/push",{method:"PUT",body:JSON.stringify({blob,baseVersion:remote.version})});
    }catch(e){
      if(e.status===409&&e.data&&e.data.blob){          /* кто-то успел раньше — сливаем ещё раз */
        const rs2=await decryptBlob(e.data.blob);
        S=migrate(Object.assign(fresh(),mergeStates(S,migrate(Object.assign(fresh(),rs2)))));
        S.updatedAt=Date.now(); save();
        res=await api("/sync/push",{method:"PUT",
          body:JSON.stringify({blob:await encryptBlob(S),baseVersion:e.data.serverVersion})});
      }else throw e;
    }
    ACCT.version=res.version; ACCT.lastSync=Date.now(); acctSave();
    render();
    if(!silent)toast("Синхронизировано ✓");
    return true;
  }catch(e){
    if(!silent)toast(e.message||"Ошибка синхронизации");
    return false;
  }finally{SYNCING=false;updateSyncBadge();}
}
/* автосинхронизация — с задержкой, чтобы не дёргать сервер на каждое действие */
function autoSync(){
  if(!isLoggedIn())return;
  if(S.settings&&S.settings.autoSync===false)return;
  clearTimeout(_cloudT);
  _cloudT=setTimeout(()=>syncNow(true),4000);
}
function updateSyncBadge(){
  const el=$("#syncBadge"); if(!el)return;
  const st=syncState();
  el.className="sync-badge "+st;
  el.textContent={off:"",sync:"↻",never:"•",ok:"✓"}[st]||"";
  el.style.display=st==="off"?"none":"";
}

/* ---------- вход / регистрация ---------- */
async function doAuth(mode,login,password){
  if(!syncUrl())throw new Error("сначала укажи адрес сервера");
  if(!validLoginName(login))throw new Error("Логин: 3–32 символа, латиница, цифры, точка, дефис");
  if((password||"").length<8)throw new Error("Пароль минимум 8 символов");
  /* запоминаем текущую сессию: неудачная попытка входа не должна её ломать */
  const prevAcct=ACCT, prevKey=ENCKEY;
  const{encRaw,authKey}=await deriveKeys(login,password);
  ACCT={login:String(login).trim().toLowerCase(),token:null,version:0,lastSync:0,key:b64(encRaw)};
  ENCKEY=await importEncKey(encRaw);
  let r;
  try{
    r=await api("/sync/"+(mode==="register"?"register":"login"),
      {method:"POST",body:JSON.stringify({login:ACCT.login,authKey})});
  }catch(e){
    ACCT=prevAcct; ENCKEY=prevKey;
    if(prevAcct)acctSave(); else acctClear();
    throw e;
  }
  ACCT.token=r.token; ACCT.version=r.version||0; acctSave();
  await syncNow(true);
  return true;
}
function validLoginName(s){return /^[a-zA-Z0-9._-]{3,32}$/.test(String(s||"").trim());}
async function doLogout(){
  try{await api("/sync/logout",{method:"POST"});}catch(e){}
  acctClear(); render(); toast("Вышли из аккаунта");
}
async function changePassword(oldPass,newPass){
  if(!isLoggedIn())throw new Error("нужен вход");
  if((newPass||"").length<8)throw new Error("Новый пароль минимум 8 символов");
  const old=await deriveKeys(ACCT.login,oldPass);
  if(b64(old.encRaw)!==ACCT.key)throw new Error("Старый пароль неверный");
  const nw=await deriveKeys(ACCT.login,newPass);
  ENCKEY=await importEncKey(nw.encRaw);
  const blob=await encryptBlob(S);
  const r=await api("/sync/rekey",{method:"POST",body:JSON.stringify({authKey:nw.authKey,blob})});
  ACCT.key=b64(nw.encRaw); ACCT.version=r.version; ACCT.lastSync=Date.now(); acctSave();
  return true;
}

      ${cfg.serverUrl?`

    `}
    <div id="acStatus" class="help" style="margin-top:12px;min-height:18px"></div>

  if($("#acSaveUrl"))$("#acSaveUrl").onclick=()=>{

  if($("#acLoginBtn"))$("#acLoginBtn").onclick=()=>run(()=>doAuth("login",$("#acLogin").value,$("#acPassIn").value));
  if($("#acRegBtn"))$("#acRegBtn").onclick=()=>run(()=>doAuth("register",$("#acLogin").value,$("#acPassIn").value));
  if($("#acSync"))$("#acSync").onclick=()=>run(()=>syncNow(false));
  if($("#acAuto"))$("#acAuto").onchange=(e)=>{S.settings.autoSync=e.target.checked;save();
    toast(e.target.checked?"Автосинхронизация включена":"Автосинхронизация выключена");};

<script>
"use strict";
/* =====================================================================
   ЛОКАЛЬНЫЙ АККАУНТ (логин и пароль без сервера)
   Данные остаются в памяти телефона, но хранятся ЗАШИФРОВАННЫМИ.
   Ключ выводится из пароля и никуда не отправляется.
   ===================================================================== */
const LKEY="kopilka_local";
let LOCAL=null;        /* {on, login, salt, verifier, remember, key} */
let LOCKKEY=null;      /* CryptoKey для шифрования локальных данных */

function localLoad(){
  try{LOCAL=JSON.parse(localStorage.getItem(LKEY)||"null");}catch(e){LOCAL=null;}
  return LOCAL;
}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify(LOCAL));}catch(e){}}
function localOn(){return !!(LOCAL&&LOCAL.on);}
/* данные в хранилище лежат зашифрованными? */
function storeEncrypted(){
  try{const raw=localStorage.getItem(KEY);return !!raw&&raw.slice(0,10).indexOf('"enc"')>=0;}catch(e){return false;}
}
async function deriveLocalKey(login,password,saltB64){
  const enc=new TextEncoder();
  const salt=saltB64?unb64(saltB64):new Uint8Array(await crypto.subtle.digest("SHA-256",
    enc.encode("kopilka-local:"+String(login).trim().toLowerCase())));
  const base=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,256);
  return new Uint8Array(bits);
}
async function keyVerifier(raw){
  return hex(await crypto.subtle.digest("SHA-256",raw));   /* для проверки пароля */
}
async function encLocal(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},LOCKKEY,
    new TextEncoder().encode(JSON.stringify(obj)));
  const out=new Uint8Array(iv.length+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),iv.length);
  return JSON.stringify({enc:1,v:1,d:b64(out)});
}
async function decLocal(raw){
  const o=JSON.parse(raw);
  const all=unb64(o.d);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},LOCKKEY,all.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- сохранение в зашифрованном виде ---------- */
let _encT=null, _encPending=false;
function scheduleEncSave(){
  _encPending=true;
  clearTimeout(_encT);
  _encT=setTimeout(flushEncSave,150);
}
async function flushEncSave(){
  if(!_encPending||!LOCKKEY)return;
  _encPending=false;
  try{localStorage.setItem(KEY,await encLocal(S));}catch(e){}
}
/* при сворачивании и закрытии дописываем немедленно, чтобы ничего не потерять */
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushEncSave();});
window.addEventListener("pagehide",()=>{flushEncSave();});

/* ---------- экран входа ---------- */
function gateShow(html){
  const g=$("#gate"); g.classList.add("on");
  $("#gatebox").innerHTML=`<div class="gatewrap">
    <div class="gatelogo"><span class="logo" style="width:52px;height:52px;border-radius:16px">
      <svg viewBox="0 0 24 24" fill="none" width="27" height="27"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="#04120c" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="14" height="10" rx="3" stroke="#04120c" stroke-width="2"/><circle cx="12" cy="15" r="1.3" fill="#04120c"/></svg></span></div>
    ${html}</div>`;
}
function gateHide(){$("#gate").classList.remove("on");}

function openGateLogin(){
  gateShow(`
    <div class="gatetitle">Копилка</div>
    <div class="gatesub">Вход в личный кабинет</div>
    <div class="field"><label>Логин</label>
      <input class="inp" id="gLogin" autocapitalize="none" autocorrect="off" spellcheck="false"
        autocomplete="username" value="${esc((LOCAL&&LOCAL.login)||"")}"></div>
    <div class="field"><label>Пароль</label>
      <input class="inp" id="gPass" type="password" autocomplete="current-password" enterkeyhint="go"></div>
    <button class="btn" id="gEnter">Войти</button>
    <div id="gErr" class="help" style="margin-top:12px;min-height:18px;text-align:center"></div>
  `);
  const err=$("#gErr");
  const go=async()=>{
    const login=$("#gLogin").value.trim(), pass=$("#gPass").value;
    if(!login||!pass){err.innerHTML='<span class="r">Введи логин и пароль</span>';return;}
    err.textContent="Проверяю…";
    try{
      const raw=await deriveLocalKey(login,pass,LOCAL.salt);
      if(await keyVerifier(raw)!==LOCAL.verifier){
        err.innerHTML='<span class="r">Неверный логин или пароль</span>';
        try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
        return;
      }
      LOCKKEY=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
      if(LOCAL.remember!==false){LOCAL.key=b64(raw);localSave();}
      await afterUnlock();
    }catch(e){err.innerHTML='<span class="r">'+esc(e.message||String(e))+'</span>';}
  };
  $("#gEnter").onclick=go;
  $("#gPass").onkeydown=(e)=>{if(e.key==="Enter")go();};
  setTimeout(()=>{try{($("#gLogin").value?$("#gPass"):$("#gLogin")).focus();}catch(e){}},80);
}
/* после успешного входа — расшифровать и запустить приложение */
async function afterUnlock(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw&&storeEncrypted())S=migrate(Object.assign(fresh(),await decLocal(raw)));
    else S=load();
  }catch(e){
    gateShow(`<div class="gatetitle">Не удалось открыть данные</div>
      <div class="gatesub">Данные зашифрованы другим паролем.</div>
      <button class="btn ghost" id="gBack">Попробовать снова</button>`);
    $("#gBack").onclick=openGateLogin; return;
  }
  gateHide();
  applyTheme(); render(); updateSyncBadge();
  bootLock();                       /* пин-код поверх, если включён */
  checkAchievements(true); checkReminders();
  if(typeof isLoggedIn==="function"&&isLoggedIn())syncNow(true);
  if(typeof bootRest==="function")bootRest();
}

/* ---------- создание / отключение аккаунта ---------- */
function openLocalAccount(){
  const on=localOn();
  openSheet(`
    <h2>👤 Вход по логину и паролю</h2>
    <div class="help" style="margin-bottom:14px">Данные остаются <b style="color:var(--txt)">в памяти телефона</b> и никуда не отправляются. Пароль шифрует их: без него открыть не получится даже с этого же телефона.</div>
    ${on?`
      <div class="card" style="padding:14px;margin-bottom:14px">
        <div class="stat"><span class="k">Логин</span><span class="v">${esc(LOCAL.login)}</span></div>
        <div class="stat"><span class="k">Данные зашифрованы</span><span class="tag g">да</span></div>
        <div class="stat"><span class="k">Не спрашивать пароль каждый раз</span>
          <input type="checkbox" id="laRemember" ${LOCAL.remember!==false?"checked":""} style="width:22px;height:22px;accent-color:var(--acc)"></div>
      </div>
      <div class="help" style="margin-bottom:14px">Если галочка снята — пароль спрашивается при каждом запуске, и данные защищены по-настоящему. Если стоит — вход защищает от постороннего, но ключ лежит на телефоне рядом с данными.</div>
      <button class="btn ghost" id="laPass" style="margin-bottom:10px">Сменить пароль</button>
      <button class="btn ghost" id="laOff" style="color:var(--exp)">Отключить вход и снять шифрование</button>
    `:`
      <div class="banner red" style="margin-bottom:14px"><span style="font-size:20px">⚠️</span>
        <div class="bt"><b>Пароль восстановить нельзя</b>Он и есть ключ шифрования. Забудешь — данные не откроются. Сначала сделай резервную копию.</div></div>
      <button class="btn ghost" id="laBackup" style="margin-bottom:14px">💾 Сделать резервную копию</button>
      <div class="field"><label>Логин</label>
        <input class="inp" id="laLogin" placeholder="например kairat" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label>Пароль</label>
        <input class="inp" id="laPass1" type="password" placeholder="минимум 6 символов"></div>
      <div class="field"><label>Повтори пароль</label>
        <input class="inp" id="laPass2" type="password"></div>
      <label style="display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13.5px">
        <input type="checkbox" id="laAck" style="width:22px;height:22px;accent-color:var(--acc)">
        <span>Я записал пароль и сделал копию</span></label>
      <button class="btn" id="laCreate">Включить вход по паролю</button>
    `}
    <div id="laStatus" class="help" style="margin-top:12px;min-height:18px"></div>
    <button class="btn ghost" id="laClose" style="margin-top:12px">Закрыть</button>
  `);
  const st=$("#laStatus");
  if($("#laBackup"))$("#laBackup").onclick=openBackup;
  if($("#laRemember"))$("#laRemember").onchange=(e)=>{
    LOCAL.remember=e.target.checked;
    if(!e.target.checked)delete LOCAL.key;
    else if(LOCKKEY)st.innerHTML='<span class="y">Ключ сохранится при следующем входе</span>';
    localSave(); toast("Сохранено");
  };
  if($("#laCreate"))$("#laCreate").onclick=async()=>{
    const login=$("#laLogin").value.trim(), p1=$("#laPass1").value, p2=$("#laPass2").value;
    if(!/^[A-Za-z0-9._-]{3,32}$/.test(login)){st.innerHTML='<span class="r">Логин: 3–32 символа, латиница и цифры</span>';return;}
    if(p1.length<6){st.innerHTML='<span class="r">Пароль минимум 6 символов</span>';return;}
    if(p1!==p2){st.innerHTML='<span class="r">Пароли не совпадают</span>';return;}
    if(!$("#laAck").checked){st.innerHTML='<span class="r">Подтверди, что записал пароль</span>';return;}
    st.textContent="Шифрую данные…";
    try{
      const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
      const raw=await deriveLocalKey(login,p1,salt);
      LOCKKEY=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
      LOCAL={on:true,login:login.toLowerCase(),salt,verifier:await keyVerifier(raw),remember:true,key:b64(raw)};
      localSave();
      localStorage.setItem(KEY,await encLocal(S));    /* перезаписываем данные шифром */
      closeSheet(); render(); celebrate("🔐"); toast("Вход включён, данные зашифрованы");
    }catch(e){st.innerHTML='<span class="r">'+esc(e.message||String(e))+'</span>';}
  };
  if($("#laPass"))$("#laPass").onclick=async()=>{
    const cur=prompt("Текущий пароль"); if(!cur)return;
    const nw=prompt("Новый пароль (минимум 6 символов)"); if(!nw)return;
    if(nw.length<6){toast("Слишком короткий пароль");return;}
    try{
      const oldRaw=await deriveLocalKey(LOCAL.login,cur,LOCAL.salt);
      if(await keyVerifier(oldRaw)!==LOCAL.verifier){toast("Текущий пароль неверный");return;}
      const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
      const raw=await deriveLocalKey(LOCAL.login,nw,salt);
      LOCKKEY=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
      LOCAL.salt=salt; LOCAL.verifier=await keyVerifier(raw);
      if(LOCAL.remember!==false)LOCAL.key=b64(raw);
      localSave(); localStorage.setItem(KEY,await encLocal(S));
      toast("Пароль изменён");
    }catch(e){toast("Не удалось сменить пароль");}
  };
  if($("#laOff"))$("#laOff").onclick=async()=>{
    const cur=prompt("Введи пароль, чтобы отключить вход"); if(!cur)return;
    try{
      const raw=await deriveLocalKey(LOCAL.login,cur,LOCAL.salt);
      if(await keyVerifier(raw)!==LOCAL.verifier){toast("Пароль неверный");return;}
      LOCAL=null; LOCKKEY=null;
      try{localStorage.removeItem(LKEY);}catch(e){}
      localStorage.setItem(KEY,JSON.stringify(S));   /* обратно в открытый вид */
      closeSheet(); render(); toast("Вход отключён");
    }catch(e){toast("Не удалось отключить");}
  };
  $("#laClose").onclick=closeSheet;
}
</script>

<script>
"use strict";
/* =====================================================================
   v3: МЕНЮ ДОБАВЛЕНИЯ · ПЕРЕВОДЫ · НАЛИЧНЫЕ · ПЛАН · ОТЧЁТ · ДОСТИЖЕНИЯ

/* ---------- МЕНЮ КНОПКИ «+» ---------- */

  openSheet(`
    <h2>Что добавить?</h2>
    <div class="card" style="padding:6px 14px">
      ${item("income","💰","Доход","Зарплата, подработка, продажа")}
      ${item("expense","💸","Расход","Покупка, оплата, услуга")}
      ${item("transfer","🔄","Перевод человеку","Деньги ушли другому человеку")}
      ${item("cash","💵","Наличные","Снял или внёс наличные")}
      ${item("jar","🐷","Пополнить копилку","Отложить без траты денег")}
      ${item("goal","🎯","Создать цель","Новая копилка с целью")}

  `);
