    else if(a==="expense")openTx("expense");
    else if(a==="transfer")openTransferSheet();
    else if(a==="cash")openCashSheet();
    else if(a==="jar")jarMove(ensureJar().id,"in");
    else openJar();
  });
  $("#amClose").onclick=closeSheet;
}

/* ---------- ПЕРЕВОД ЧЕЛОВЕКУ ---------- */
function openTransferSheet(){
  const people=topCounterparties(8);
  openSheet(`
    <h2>🔄 Перевод</h2>
    <div class="seg" style="margin-bottom:16px">
      <button id="trOut" class="on-r">Я перевёл</button>
      <button id="trIn" class="">Мне перевели</button>
    </div>
    <div class="amt-wrap"><div class="amt-lbl">Сколько?</div>
      <div class="amt-line"><input class="big-amt num" id="trAmt" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0"><span class="amt-cur">₸</span></div></div>
    ${quickAmountRow("trAmt")}
    <div class="field" style="margin-top:14px"><label>Кому / от кого</label>
      <input class="inp" id="trWho" placeholder="Имя человека" autocomplete="off"></div>
    ${people.length?`<div class="chips" style="margin-bottom:14px">${people.map(p=>`<button class="chip" data-who="${esc(p)}">👤 ${esc(p)}</button>`).join("")}</div>`:""}
    <div class="field"><label>Дата</label><input class="inp" id="trDate" type="date" value="${todayISO()}"></div>
    <button class="btn danger" id="trSave">Сохранить перевод</button>
  `);
  let dir=-1;
  const setDir=(d)=>{dir=d;
    $("#trOut").className=d<0?"on-r":"";$("#trIn").className=d>0?"on-g":"";
    $("#trSave").className="btn "+(d>0?"":"danger");
    $("#trSave").textContent="Сохранить перевод";};
  $("#trOut").onclick=()=>setDir(-1); $("#trIn").onclick=()=>setDir(1);
  bindAmount("trAmt");
  document.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>{$("#trWho").value=b.dataset.who;});
  $("#trSave").onclick=()=>{
    const a=toNum($("#trAmt").value); if(!a){toast("Введи сумму");return;}
    const who=$("#trWho").value.trim()||"Без имени";
    const t={id:uid(),ts:Date.now(),date:$("#trDate").value||todayISO(),time:"",
      dir,amount:a,wallet:"account",
      operationType:dir>0?OP.TRANSFER_IN:OP.TRANSFER_OUT,
      type:dir>0?"income":"expense",
      category:dir>0?"Перевод":"Переводы",
      counterparty:who,counterpartyType:"person",merchant:"",
      note:(dir>0?"Перевод от ":"Перевод ")+who,rawDescription:(dir>0?"Пополнение ":"Перевод ")+who,
      source:"manual"};
    t.fingerprint=fingerprintOf(t);
    S.transactions.push(t); save(); closeSheet(); render();
    celebrate(dir>0?"💚":"🔄"); toast("Перевод сохранён");
  };
}
function topCounterparties(n){
  const m={};
  for(const t of S.transactions){
    if(t.counterpartyType!=="person"||!t.counterparty)continue;
    m[t.counterparty]=(m[t.counterparty]||0)+1;
  }
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
}

/* ---------- НАЛИЧНЫЕ ---------- */
function openCashSheet(){
  const ms=moneyState();
  openSheet(`
    <h2>💵 Наличные</h2>
    <div class="card" style="padding:14px;margin-bottom:14px">
      <div class="stat"><span class="k">Расчётный остаток наличных</span><span class="v ${ms.cash<0?'r':''}">${money(ms.cash)}</span></div>
      ${ms.cashUnknown?`<div class="help r" style="margin-top:8px">Остаток отрицательный: часть наличных пришла из источников вне выписки. Укажи начальный остаток наличных в настройках.</div>`:""}
    </div>
    <div class="seg" style="margin-bottom:16px">
      <button id="cwOut" class="on-g">Снял в банкомате</button>
      <button id="cwIn" class="">Внёс на счёт</button>
      <button id="cwSpend" class="">Потратил наличными</button>
    </div>
    <div class="amt-wrap"><div class="amt-lbl">Сколько?</div>
      <div class="amt-line"><input class="big-amt num" id="cwAmt" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0"><span class="amt-cur">₸</span></div></div>
    ${quickAmountRow("cwAmt")}
    <div id="cwCatWrap" class="field hidden" style="margin-top:14px"><label>Категория траты</label>
      <div class="catscroll"><div class="catgrid">${EXP_CATS.map(([c,em])=>`<button data-cwc="${esc(c)}"><span class="e">${em}</span>${c}</button>`).join("")}</div></div></div>
    <div class="field" style="margin-top:14px"><label>Где / заметка</label><input class="inp" id="cwNote" placeholder="необязательно"></div>
    <div class="field"><label>Дата</label><input class="inp" id="cwDate" type="date" value="${todayISO()}"></div>
    <div id="cwHint" class="help" style="margin-bottom:14px">Снятие наличных — это перемещение денег, а не расход. Капитал не уменьшается.</div>
    <button class="btn gold" id="cwSave">Сохранить</button>
  `);
  let mode="out",cat="";
  const setMode=(m)=>{mode=m;
    $("#cwOut").className=m==="out"?"on-g":"";$("#cwIn").className=m==="in"?"on-g":"";$("#cwSpend").className=m==="spend"?"on-r":"";
    $("#cwCatWrap").classList.toggle("hidden",m!=="spend");
    $("#cwHint").textContent = m==="spend"
      ? "Трата наличными уменьшает капитал — это настоящий расход."
      : m==="in" ? "Внесение наличных на счёт — перемещение денег, капитал не меняется."
      : "Снятие наличных — это перемещение денег, а не расход. Капитал не уменьшается.";
    $("#cwSave").className="btn "+(m==="spend"?"danger":"gold");};
  $("#cwOut").onclick=()=>setMode("out");$("#cwIn").onclick=()=>setMode("in");$("#cwSpend").onclick=()=>setMode("spend");
  bindAmount("cwAmt");
  document.querySelectorAll("[data-cwc]").forEach(b=>b.onclick=()=>{
    cat=b.dataset.cwc;document.querySelectorAll("[data-cwc]").forEach(x=>x.classList.toggle("on",x===b));});
  $("#cwSave").onclick=()=>{
    const a=toNum($("#cwAmt").value); if(!a){toast("Введи сумму");return;}
    if(mode==="spend"&&!cat){toast("Выбери категорию");return;}
    const note=$("#cwNote").value.trim(), date=$("#cwDate").value||todayISO();
    let t;
    if(mode==="out")t={operationType:OP.CASH_WITHDRAWAL,type:"neutral",dir:-1,wallet:"account",
      category:"Наличные",counterparty:note||"Банкомат",counterpartyType:"atm",note:note||"Снятие наличных"};
    else if(mode==="in")t={operationType:OP.CASH_DEPOSIT,type:"neutral",dir:1,wallet:"account",
      category:"Наличные",counterparty:note||"Внесение на счёт",counterpartyType:"atm",note:note||"Внесение наличных"};
    else t={operationType:OP.EXPENSE,type:"expense",dir:-1,wallet:"cash",
      category:cat,counterparty:note||cat,counterpartyType:"merchant",note:note||("Оплата наличными: "+cat)};
    t=Object.assign({id:uid(),ts:Date.now(),date,time:"",amount:a,merchant:"",
      rawDescription:t.note,source:"manual"},t);
    t.fingerprint=fingerprintOf(t);
    S.transactions.push(t);save();closeSheet();render();celebrate("💵");toast("Сохранено");
  };
}

/* ---------- НАЧАЛЬНЫЕ ОСТАТКИ (наличные и другие счета) ---------- */
function openOpening(){

  openSheet(`
    <h2>Уточнить остатки</h2>

/* ---------- ПЛАН БЮДЖЕТА + «сколько можно потратить» ---------- */
function daysLeftInMonth(){
  const d=new Date(); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return Math.max(1,last-d.getDate()+1);
}
function safeToSpend(){
  const ms=moneyState(), plan=S.settings.plan||{};
  const mtx=monthTx(curMonth());
  const spentReal=spendBreakdown(mtx).real;
  /* Обязательства, которые РЕАЛЬНО ещё не оплачены (просрочка + горизонт).
     Уже оплаченные платежи не вычитаем — иначе деньги считались бы дважды.
     То, что лежит в копилке «На обязательные платежи», из свободных денег
     уже вычтено (это отложенное), поэтому вычитаем только непокрытый остаток. */
  const bp=billsPlan();
  const rec=bp.need;
  const base=Math.max(0,ms.available-Math.max(0,rec-bp.reserve));
  const budgetLeft=plan.free?Math.max(0,plan.free-spentReal):base;
  const pool=Math.max(0,Math.min(base,budgetLeft||base));
  const days=daysLeftInMonth();
  return{pool,days,perDay:Math.floor(pool/days),spentReal,rec,
    billsNeed:bp.need,billsReserve:bp.reserve,billsDeficit:bp.deficit,budgetFree:plan.free||0};
}
function openPlan(){
  const p=S.settings.plan||{}, ms=moneyState();
  openSheet(`
    <h2>Финансовый план на месяц</h2>
    <div class="help" style="margin-bottom:14px">Распредели ожидаемый доход. Это твой план — приложение будет показывать, соблюдаешь ли ты его. Не финансовая рекомендация.</div>
    <div class="field"><label>Ожидаемый доход, ₸</label><input class="inp num" id="plIncome" type="text" inputmode="numeric" autocomplete="off" value="${fmtInput(String(p.income||0))}"></div>
    <div class="field"><label>Обязательные расходы</label><input class="inp num" id="plMand" type="text" inputmode="numeric" autocomplete="off" value="${fmtInput(String(p.mandatory||0))}"></div>
    <div class="field"><label>Накопления</label><input class="inp num" id="plSav" type="text" inputmode="numeric" autocomplete="off" value="${fmtInput(String(p.savings||0))}"></div>
    <div class="field"><label>Свободные расходы</label><input class="inp num" id="plFree" type="text" inputmode="numeric" autocomplete="off" value="${fmtInput(String(p.free||0))}"></div>
    <div class="field"><label>Резерв</label><input class="inp num" id="plRes" type="text" inputmode="numeric" autocomplete="off" value="${fmtInput(String(p.reserve||0))}"></div>
    <div id="plPrev" class="card" style="padding:14px;margin-bottom:14px"></div>
    <button class="btn" id="plSave">Сохранить план</button>
    <button class="btn ghost" id="plAuto" style="margin-top:10px">Заполнить по моим данным</button>
    <button class="btn ghost" id="plClose" style="margin-top:10px">Закрыть</button>
  `);
  const ids=["plIncome","plMand","plSav","plFree","plRes"];
  const upd=()=>{
    const v=ids.map(i=>toNum($("#"+i).value));
    const sum=v[1]+v[2]+v[3]+v[4], diff=v[0]-sum;
    $("#plPrev").innerHTML=`
      <div class="stat"><span class="k">Распределено</span><span class="v">${money(sum)}</span></div>
      <div class="stat"><span class="k">${diff>=0?"Не распределено":"Превышение плана"}</span><span class="v ${diff<0?'r':'g'}">${money(Math.abs(diff))}</span></div>
      ${v[0]?`<div class="stat"><span class="k">Норма накопления по плану</span><span class="v y">${Math.round(v[2]/v[0]*100)}%</span></div>`:""}`;
  };
  ids.forEach(i=>{const el=$("#"+i);el.oninput=()=>{el.value=fmtInput(el.value);upd();};});
  upd();
  $("#plAuto").onclick=()=>{
    const inc=Math.round(avgMonthlyIncome()), mand=recommendedMandatory();
    $("#plIncome").value=fmtInput(String(inc));
    $("#plMand").value=fmtInput(String(Math.min(mand,inc)));
    $("#plSav").value=fmtInput(String(Math.round(inc*0.15)));
    $("#plFree").value=fmtInput(String(Math.max(0,inc-mand-Math.round(inc*0.15))));
    $("#plRes").value=fmtInput("0"); upd();

function avgMonthlyIncome(){
  const m={};
  for(const t of S.transactions){const e=txEffect(t);if(!e.inc)continue;const k=monthKey(t.date);m[k]=(m[k]||0)+t.amount;}
  const ks=Object.keys(m).sort().slice(-3); if(!ks.length)return 0;
  return ks.reduce((a,k)=>a+m[k],0)/ks.length;
}

/* ---------- РЕКОМЕНДАЦИЯ ПО СВОБОДНЫМ ДЕНЬГАМ ---------- */
function allocationAdvice(){
  const ms=moneyState(); const free=ms.available;
  if(free<=0)return null;
  const cushion=S.jars.find(j=>j.type==="cushion");
  const cushionGap=cushion?Math.max(0,cushion.target-jarCurrent(cushion)):0;
  const goals=S.jars.filter(j=>j.target&&j.type!=="cushion"&&jarCurrent(j)<j.target);
  const rec=Math.max(0,billsPlan().deficit);
  const parts=[];
  let left=free;
  const take=(share,cap)=>{const v=Math.max(0,Math.min(Math.round(free*share),cap===undefined?Infinity:cap,left));left-=v;return v;};
  const oblig=Math.min(rec,left); left-=oblig;   /* сначала закрываем обязательное */
  if(oblig)parts.push({em:"🔒",name:"Обязательные платежи",amount:oblig,why:"их пока нечем закрыть"});
  const res=take(0.2,cushionGap||undefined);
  if(res)parts.push({em:"🛡",name:cushion?"Финансовая подушка":"Резерв",amount:res,why:cushion?"до цели подушки":"запас на непредвиденное"});
  if(goals.length){
    const g=goals[0];const v=take(0.25,Math.max(0,g.target-jarCurrent(g)));
    if(v)parts.push({em:g.emoji||"🎯",name:g.name,amount:v,why:"ближайшая цель"});
  }
  const spend=take(0.25);
  if(spend)parts.push({em:"🛒",name:"Текущие расходы",amount:spend,why:"на жизнь до конца месяца"});
  if(left>0)parts.push({em:"💰",name:"Оставить свободными",amount:left,why:"запас гибкости"});
  return{free,parts};
}

function scoreDetail(){
  const idx=financeIndex();

  const rate=t.inc?(t.inc-t.exp)/t.inc:0;

  const cushion=S.jars.find(j=>j.type==="cushion");
  if(!cushion)tips.push({em:"🛡",text:"Создать финансовую подушку — она сильнее всего поднимает рейтинг."});
  else if(jarCurrent(cushion)<cushion.target)
    tips.push({em:"🛡",text:`Пополнить подушку ещё на ${money(cushion.target-jarCurrent(cushion))}.`});
  const over=overBudgetCats();
  if(over.length)tips.push({em:"🔴",text:`Не превышать бюджет по категориям: ${over.slice(0,2).join(", ")}.`});
  const od=(S.loans||[]).filter(isOverdue).length;
  if(od)tips.push({em:"⏰",text:`Закрыть просроченный долг из копилки (${od}).`});
  const sb=spendBreakdown(mtx), prev=spendBreakdown(monthTx(prevMonthKey()));
  if(prev.real&&sb.real>prev.real*1.1)
    tips.push({em:"📉",text:`Сократить траты на ${Math.round((sb.real-prev.real*1.1)/1000)*1000} ₸, чтобы вернуться к уровню прошлого месяца.`});
  return{idx,tips:tips.slice(0,4)};
}
function overBudgetCats(){
  const b=S.budgets||{}, cur=monthTx(curMonth());
  return Object.keys(b).filter(c=>{
    const sp=cur.filter(x=>x.category===c&&txEffect(x).exp).reduce((a,x)=>a+x.amount,0);
    return b[c]&&sp>b[c];});
}

/* ---------- НЕДЕЛЬНЫЙ ФИНАНСОВЫЙ ОТЧЁТ ---------- */
function weekBounds(offset){
  const d=new Date(); d.setHours(0,0,0,0);
  const dow=(d.getDay()+6)%7;           /* понедельник = 0 */
  const start=new Date(d); start.setDate(d.getDate()-dow-7*(offset||0));
  const end=new Date(start); end.setDate(start.getDate()+6);
  return{from:start.toISOString().slice(0,10),to:end.toISOString().slice(0,10)};
}
function weekStats(offset){
  const{from,to}=weekBounds(offset);
  const list=S.transactions.filter(t=>t.date>=from&&t.date<=to);
  const t=totals(list), sb=spendBreakdown(list), cf=cashFlow(list);
  let saved=0;
  for(const j of S.jars||[])for(const m of j.moves||[])
    if(m.date>=from&&m.date<=to)saved+= m.type==="in"?m.amount:-m.amount;
  const rate=t.inc?(saved/t.inc*100):0;
  const byCat={};
  for(const x of list){if(!txEffect(x).exp||NON_SPEND_CATS.includes(x.category))continue;
    byCat[x.category]=(byCat[x.category]||0)+x.amount;}
  return{from,to,inc:t.inc,exp:t.exp,real:sb.real,transfers:sb.transfers,cashOut:cf.out,
    saved,rate,byCat,count:list.length};
}
function openWeeklyReport(){

    </div>
    ${problem?`<div class="banner red" style="margin-bottom:12px"><span style="font-size:20px">⚠️</span>

    ${win?`<div class="banner" style="margin-bottom:12px"><span style="font-size:20px">🔥</span>

    <div class="help" style="margin-top:14px">Отчёт построен на твоих операциях. Это наблюдения, а не гарантия результата.</div>

function checkAchievements(silent){

  }
  if(newly.length){
    save();
    if(!silent){celebrate("🏆");toast("Достижение: "+newly[0].name);}

/* ---------- DRILL-DOWN по показателям ---------- */
function openDrill(kind){
  const list=rangeTx(statRange);
  const pick={
    income:t=>txEffect(t).inc>0,
    expense:t=>txEffect(t).exp>0,
    real:t=>txEffect(t).exp>0&&!NON_SPEND_CATS.includes(t.category),
    transfers:t=>t.operationType===OP.TRANSFER_OUT||t.operationType===OP.TRANSFER_IN,
    cash:t=>t.operationType===OP.CASH_WITHDRAWAL||t.operationType===OP.CASH_DEPOSIT||t.wallet==="cash",
    internal:t=>t.operationType===OP.INTERNAL,
    fees:t=>t.operationType===OP.FEE,
    unknown:t=>t.operationType===OP.UNKNOWN
  }[kind]||(()=>true);
  const titles={income:"Доходы",expense:"Расходы",real:"Реальные траты",transfers:"Переводы",
    cash:"Наличные",internal:"Между своими счетами",fees:"Комиссии",unknown:"Не распознано"};
  const sel=list.filter(pick).sort((a,b)=>a.date<b.date?1:-1);
  const sum=sel.reduce((a,t)=>a+t.amount,0);
  const m={};for(const t of sel){const k=t.counterparty||t.category||"—";m[k]=(m[k]||0)+t.amount;}
  const tops=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);
  openSheet(`
    <h2>${titles[kind]||"Детали"}</h2>
    <div class="hero" style="padding:18px;margin-bottom:14px">
      <div class="lbl">Всего за период (${rangeLabel(statRange)})</div>
      <div class="bal" style="font-size:clamp(24px,8vw,34px)">${fmt(sum)} <span class="cur">₸</span></div>
      <div class="sub">${sel.length} ${plural(sel.length,"операция","операции","операций")}</div>
    </div>
    ${tops.length>1?`<div class="section-title" style="margin-top:0">Основные</div>
    <div class="card"><div class="legend">${tops.map(([k,v],i)=>`<div class="li">
      <span class="dot" style="background:${CHART_C[i%CHART_C.length]}"></span>
      <span class="nm">${esc(k)}</span><span class="vv">${fmt(v)}</span></div>`).join("")}</div></div>`:""}

    <div class="card" style="padding:6px 14px">${sel.slice(0,80).map(txRow).join("")||emptyBox("📊","Пусто","")}</div>

  `);

    }catch(_){}

})();
