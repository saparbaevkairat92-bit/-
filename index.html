function doImport(){
  let n=0;const meta=REVMETA||{};
  /* начальный остаток — не доход, а стартовый баланс */
  if(meta.opening!=null&&meta.opening>0&&meta.from){
    const fp=cyrb53("opening|"+meta.statementId);
    if(!S.transactions.some(t=>t.fingerprint===fp)&&!S.transactions.some(t=>t.operationType==="opening")){
      S.transactions.push({id:uid(),ts:new Date(meta.from+"T00:00:00").getTime()||Date.now(),date:meta.from,
        type:"neutral",dir:1,amount:meta.opening,operationType:"opening",category:"Остаток",
        counterparty:"Начальный остаток",counterpartyType:"self",note:"Начальный остаток по выписке Kaspi",
        rawDescription:"Начальный остаток по выписке",source:"kaspi",statementId:meta.statementId,fingerprint:fp});
    }
  }
  for(const r of REV){
    if(!r.on)continue;
    /* пользователь поправил категорию → запоминаем правило */
    if(r.catEdited&&r.counterparty){
      const k=r.counterparty.toLowerCase();
      if(r.counterpartyType==="merchant")S.rules.merchant[k]=r.cat; else S.rules.counterparty[k]=r.cat;
    }
    const ts=new Date(r.date+"T"+(r.time||"12:00")+":00").getTime()||Date.now();
    S.transactions.push({id:uid(),ts,date:r.date,time:r.time||"",
      type:r.type,dir:r.dir,amount:r.amount,operationType:r.operationType,category:r.cat,
      counterparty:r.counterparty||"",counterpartyType:r.counterpartyType||"unknown",merchant:r.merchant||"",
      account:r.account||"",note:r.rawDescription||"",rawDescription:r.rawDescription||"",
      source:"kaspi",statementId:r.statementId||meta.statementId||"",fingerprint:r.fingerprint});
    n++;
  }
  /* журнал выписок — для еженедельного напоминания */
  if(meta.statementId&&!S.statements.some(x=>x.id===meta.statementId))
    S.statements.push({id:meta.statementId,from:meta.from,to:meta.to,imported:todayISO(),count:n});
  S.settings.lastStatement=meta.to||todayISO();
  S.settings.lastImportAt=Date.now();
  save();closeSheet();TAB="ops";render();
  celebrate("📄");toast("Импортировано операций: "+n);
}

function zlibInflate(bytes){

function pngPredict(data,columns,colors,bpc){

    for(let x=0;x<rowLen;x++){

function extractBalanced(s,key,open,close){
  let i=s.indexOf(key);if(i<0)return null;i+=key.length;

  for(;i<s.length;i++){
    if(s.substr(i,open.length)===open){depth++;i+=open.length-1;}

function pdfExtractText(bytes){
  const str=u8str(bytes);
  if(/\/Encrypt\s+\d+\s+\d+\s+R/.test(str)) throw new Error("файл защищён паролем");

  while(m=re.exec(str))marks.push({num:+m[1],bodyStart:re.lastIndex});

    const endObj=str.indexOf("endobj",mk.bodyStart);
    const bodyEnd=endObj<0?str.length:endObj;
    const sIdx=str.indexOf("stream",mk.bodyStart);
    let dict,stream=null;
    if(sIdx>=0&&sIdx<bodyEnd){
      dict=str.slice(mk.bodyStart,sIdx);
      let ds=sIdx+6;if(str[ds]==="\r")ds++;if(str[ds]==="\n")ds++;

      let de=es;if(str[de-1]==="\n")de--;if(str[de-1]==="\r")de--;

    if(!o||!o.stream)return null;let data=o.stream;

      const pm=o.dict.match(/\/Predictor\s+(\d+)/);
      if(pm&&+pm[1]>=10){
        const col=+((o.dict.match(/\/Columns\s+(\d+)/)||[])[1]||1);
        const colors=+((o.dict.match(/\/Colors\s+(\d+)/)||[])[1]||1);
        const bpc=+((o.dict.match(/\/BitsPerComponent\s+(\d+)/)||[])[1]||8);
        data=pngPredict(data,col,colors,bpc);
      }
    }
    return data;
  }

  for(const num in objs){
    const o=objs[num];
    if(/\/Type\s*\/ObjStm/.test(o.dict)){
      try{
        const d=decoded(o);if(!d)continue;const s=u8str(d);
        const N=+((o.dict.match(/\/N\s+(\d+)/)||[])[1]||0);
        const First=+((o.dict.match(/\/First\s+(\d+)/)||[])[1]||0);

        for(let k=0;k<N;k++){

  return out;
}

function extractContent(s,fonts){
  let out="",i=0;const n=s.length;let cur=null,stack=[];
  function readStr(){i++;let depth=1;const b=[];

    if(two){for(let k=0;k+1<bytes.length;k+=2){const code=(bytes[k]<<8)|bytes[k+1];r+=(map&&map[code]!=null)?map[code]:"";}}

  }

    if(c==="("){stack.push({t:"s",b:readStr()});}
    else if(c==="<"&&s[i+1]==="<"){let depth=0;while(i<n){if(s[i]==="<"&&s[i+1]==="<"){depth++;i+=2;}else if(s[i]===">"&&s[i+1]===">"){depth--;i+=2;if(depth===0)break;}else i++;}stack=[];}

    else if(c==="["){i++;const el=[];

        else if(/[-\d.]/.test(ch)){let num="";while(i<n&&/[-\d.]/.test(s[i])){num+=s[i];i++;}el.push({t:"n",v:parseFloat(num)});continue;}
        else i++;
      }i++;stack.push({t:"arr",v:el});
    }
    else if(c==="/"){i++;let nm="";while(i<n&&!/[\s\/\[\]<>()]/.test(s[i])){nm+=s[i];i++;}stack.push({t:"name",v:nm});}
    else if(/[-\d.]/.test(c)){let num="";while(i<n&&/[-\d.]/.test(s[i])){num+=s[i];i++;}stack.push({t:"n",v:parseFloat(num)});}
    else if(/[A-Za-z'"*]/.test(c)){let op="";while(i<n&&/[A-Za-z0-9'"*]/.test(s[i])){op+=s[i];i++;}
      if(op==="Tf"){for(let k=stack.length-1;k>=0;k--)if(stack[k].t==="name"){cur=stack[k].v;break;}}
      else if(op==="Tj"||op==="'"||op==="\""){const st=stack.filter(x=>x.t==="s").pop();if(st){if(op!=="Tj")out+="\n";out+=dec(st.b);}}
      else if(op==="TJ"){const ar=stack.filter(x=>x.t==="arr").pop();if(ar)for(const e of ar.v){if(e.t==="s")out+=dec(e.b);else if(e.t==="n"&&e.v<-140)out+=" ";}}
      else if(op==="Td"||op==="TD"||op==="T*"||op==="Tm"){out+="\n";}
      stack=[];
    }
    else i++;
  }
  return out;
}

    <div class="padlogo"><span class="logo" style="width:46px;height:46px;border-radius:14px"><svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="#04120c" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="14" height="10" rx="3" stroke="#04120c" stroke-width="2"/><circle cx="12" cy="15" r="1.3" fill="#04120c"/></svg></span></div>
    <div class="padtitle">${title}</div>
    <div class="padsub">${sub||""}</div>
    <div class="dots"><span></span><span></span><span></span><span></span></div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
      ${left}
      <button data-k="0">0</button>
      <button data-k="del" class="kx">⌫</button>
    </div>
  </div>`;
}
function mountPad(el,opts){padState={buf:"",opts};el.innerHTML=padHTML(opts.title,opts.sub,opts.leftLabel);el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>padPress(el,b.dataset.k));updateDots(el);}
function updateDots(el){el.querySelectorAll(".dots span").forEach((s,i)=>s.classList.toggle("on",i<padState.buf.length));}
function padPress(el,k){
  if(k==="left"){if(padState.opts.onLeft)padState.opts.onLeft();return;}
  if(k==="del")padState.buf=padState.buf.slice(0,-1);
  else if(/^\d$/.test(k)&&padState.buf.length<4)padState.buf+=k;
  updateDots(el);
  if(padState.buf.length===4){const pin=padState.buf;setTimeout(()=>{if(padState&&padState.opts)padState.opts.onDone(pin);},110);}
}
function padError(el){const d=el.querySelector(".dots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");}try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}padState.buf="";updateDots(el);}

function bootLock(){
  if(!S.settings.pin)return false;
  const el=$("#lock");el.classList.add("on");
  const box=$("#lockbox");
  mountPad(box,{title:"Введите пин-код",sub:"Копилка защищена",onDone:(pin)=>{
    if(pinHash(pin)===S.settings.pin)el.classList.remove("on");
    else padError(box);
  }});
  if(S.settings.bioId && window.PublicKeyCredential){
    const b=document.createElement("button");
    b.className="btn ghost";b.style.marginTop="18px";
    b.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="margin-right:6px;vertical-align:-3px"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10a3 3 0 0 1 6 0M8.5 13.5c.5 1.5 1.7 2.5 3.5 2.5M15.5 11v1.5"/></svg>Войти по Face ID';
    b.onclick=()=>tryBio(el,box);
    const w=box.querySelector(".padwrap");if(w)w.appendChild(b);
    setTimeout(()=>tryBio(el,box),350);
  }
  return true;
}
async function tryBio(el,box){const ok=await bioUnlock();if(ok)el.classList.remove("on");}
async function bioUnlock(){
  if(!S.settings.bioId||!window.PublicKeyCredential)return false;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const rawId=Uint8Array.from(atob(S.settings.bioId),c=>c.charCodeAt(0));
    const a=await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{type:"public-key",id:rawId}],userVerification:"required",timeout:60000}});
    return !!a;
  }catch(e){return false;}
}
async function enableBio(){
  try{
    if(!window.PublicKeyCredential){toast("Устройство не поддерживает");return;}
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const uid16=crypto.getRandomValues(new Uint8Array(16));
    const cred=await navigator.credentials.create({publicKey:{
      challenge,rp:{name:"Копилка"},user:{id:uid16,name:"kopilka",displayName:"Копилка"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
      timeout:60000,attestation:"none"
    }});
    if(!cred){toast("Отменено");return;}
    S.settings.bioId=btoa(String.fromCharCode.apply(null,new Uint8Array(cred.rawId)));
    save();toast("Face ID включён 🙂");openSettings();
  }catch(e){toast("Не удалось включить Face ID");}
}
function disableBio(){delete S.settings.bioId;save();toast("Face ID отключён");openSettings();}

function themeLabel(){const t=S.settings.theme;return t==="dark"?"Тёмная":t==="light"?"Светлая":"Как в системе";}
function cycleTheme(){const c=S.settings.theme;S.settings.theme=c==="dark"?"light":c==="light"?null:"dark";save();applyTheme();}

function openSettings(){
  const hasPin=!!S.settings.pin;
  openSheet(`
    <h2>Настройки</h2>
    <div class="stat"><span class="k">Тема оформления</span><button class="btn ghost sm" id="stTheme">${themeLabel()}</button></div>
    <div class="stat"><span class="k">Пин-код при входе</span><span class="tag ${hasPin?"g":"r"}">${hasPin?"включён":"выключен"}</span></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
      ${hasPin?`<button class="btn ghost" id="stChange">Изменить пин-код</button>${window.PublicKeyCredential?`<button class="btn ghost" id="stBio">${S.settings.bioId?"🙂 Отключить Face ID / Touch ID":"🙂 Включить Face ID / Touch ID"}</button>`:""}<button class="btn ghost" id="stOff" style="color:var(--exp)">Отключить пин-код</button>`:`<button class="btn" id="stSet">🔒 Установить пин-код</button>`}
    </div>
    <div class="help" style="margin-top:12px">Пин защищает вход и хранится на телефоне в зашифрованном виде. Если забудешь пин — вход можно вернуть только сбросом данных.</div>
    <div style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:10px">
      <button class="btn ghost" id="stBackup">💾 Резервная копия</button>
      <button class="btn ghost" id="stBudget">🎯 Бюджеты по категориям</button>
      <button class="btn ghost" id="stRec">📄 Регулярные платежи</button>
    </div>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:16px">
      <button class="btn ghost" id="stReset" style="color:var(--exp)">Сбросить все данные</button>
      <div class="help" style="margin-top:8px">Удалит все операции, копилку и челленджи без возможности восстановления.</div>
    </div>
  `);
  $("#stTheme").onclick=()=>{cycleTheme();openSettings();};
  if(hasPin){$("#stChange").onclick=pinChangeFlow;$("#stOff").onclick=pinOffFlow;if($("#stBio"))$("#stBio").onclick=S.settings.bioId?disableBio:enableBio;}
  else $("#stSet").onclick=pinSetFlow;
  $("#stBackup").onclick=openBackup;
  $("#stBudget").onclick=openBudgets;
  $("#stRec").onclick=openRecurring;
  $("#stReset").onclick=resetData;
}

function pinSetFlow(){
  openSheet(`<div id="padHost"></div>`);const host=$("#padHost");
  const confirm=(first)=>mountPad(host,{title:"Повторите пин-код",sub:"ещё раз",leftLabel:"Назад",onLeft:pinSetFlow,onDone:(p2)=>{
    if(p2===first){S.settings.pinSalt=uid();S.settings.pin=cyrb53(S.settings.pinSalt+":"+first);save();closeSheet();toast("Пин-код установлен 🔒");}
    else{padError(host);toast("Не совпало, начнём заново");setTimeout(pinSetFlow,600);}
  }});
  mountPad(host,{title:"Придумайте пин-код",sub:"4 цифры",leftLabel:"Отмена",onLeft:closeSheet,onDone:confirm});
}
function pinChangeFlow(){
  openSheet(`<div id="padHost"></div>`);const host=$("#padHost");
  mountPad(host,{title:"Текущий пин-код",sub:"для подтверждения",leftLabel:"Отмена",onLeft:closeSheet,onDone:(old)=>{
    if(pinHash(old)!==S.settings.pin){padError(host);return;}
    const confirm=(first)=>mountPad(host,{title:"Повторите новый",sub:"ещё раз",leftLabel:"Отмена",onLeft:closeSheet,onDone:(p2)=>{
      if(p2===first){S.settings.pinSalt=uid();S.settings.pin=cyrb53(S.settings.pinSalt+":"+first);save();closeSheet();toast("Пин-код изменён");}
      else{padError(host);toast("Не совпало");}
    }});
    mountPad(host,{title:"Новый пин-код",sub:"4 цифры",leftLabel:"Отмена",onLeft:closeSheet,onDone:confirm});
  }});
}
function pinOffFlow(){
  openSheet(`<div id="padHost"></div>`);const host=$("#padHost");
  mountPad(host,{title:"Введите пин-код",sub:"чтобы отключить",leftLabel:"Отмена",onLeft:closeSheet,onDone:(pin)=>{
    if(pinHash(pin)!==S.settings.pin){padError(host);return;}
    delete S.settings.pin;delete S.settings.pinSalt;delete S.settings.bioId;save();closeSheet();toast("Пин-код отключён");
  }});
}
function resetData(){
  if(!confirm("Удалить ВСЕ данные приложения? Это действие необратимо."))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  S=fresh();S.seen=true;save();closeSheet();applyTheme();TAB="home";render();toast("Данные сброшены");
}

$("#settingsBtn").onclick=openSettings;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.settings.pin)bootLock();});
window.addEventListener("pageshow",(e)=>{if(e.persisted&&S.settings.pin)bootLock();});
bootLock();
</script>

<script>
"use strict";
/* =====================================================================
   ЦЕЛИ · БЮДЖЕТЫ · РЕГУЛЯРНЫЕ ПЛАТЕЖИ · РЕЗЕРВНАЯ КОПИЯ
   ===================================================================== */

/* ---------- ЦЕЛИ ---------- */
function goalsBlock(){
  const gs=S.goals||[];
  if(!gs.length)return `<div class="section-title" style="display:flex;justify-content:space-between">🎯 Финансовые цели <span class="link" data-act="goal-new">＋ Новая</span></div>
    <div class="card">${emptyBox("🎯","Целей пока нет","Накопить на телефон, отпуск или подушку безопасности")}
    <button class="btn gold" data-act="goal-new" style="margin-top:4px">Создать цель</button></div>`;
  return `<div class="section-title" style="display:flex;justify-content:space-between">🎯 Финансовые цели <span class="link" data-act="goal-new">＋ Новая</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:16px">
    ${gs.map(g=>{
      const pct=g.target?Math.min(100,Math.round(g.current/g.target*100)):0;
      return `<div data-act="goal-open" data-id="${g.id}" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <span style="font-weight:700;font-size:14.5px">${esc(g.name)}</span>
          <span class="y" style="font-family:'Bricolage Grotesque';font-weight:700">${pct}%</span>
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin:3px 0 7px">${fmt(g.current)} / ${money(g.target)}</div>
        <div class="bar gold"><i style="width:${pct}%"></i></div>
      </div>`;}).join("")}
  </div>`;
}
function openGoal(){
  const gd={name:"",target:"",current:"",due:""};
  openSheet(`
    <h2>Новая цель</h2>
    <div class="field"><label>Название</label><input class="inp" id="gName" placeholder="Напр. Подушка безопасности" enterkeyhint="next"></div>
    <div class="field"><label>Сколько нужно, ₸</label><input class="inp num" id="gTarget" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="500 000"></div>
    <div class="field"><label>Уже накоплено, ₸</label><input class="inp num" id="gCur" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="0"></div>
    <div class="field"><label>Желаемая дата</label><input class="inp" id="gDue" type="date"></div>
    <div id="gPrev" class="help" style="margin-bottom:14px"></div>
    <button class="btn gold" id="gSave">Создать цель</button>
  `);
  const digits=(el)=>el.value.replace(/\D/g,"");
  const upd=()=>{
    const tgt=+digits($("#gTarget")||{value:""})||0, cur=+digits($("#gCur")||{value:""})||0, due=$("#gDue").value;
    if(!tgt||!due){$("#gPrev").textContent="";return;}
    const left=Math.max(0,tgt-cur), days=Math.max(1,daysBetween(todayISO(),due));
    $("#gPrev").innerHTML=`Нужно откладывать <b class="y">${money(Math.ceil(left/days))}</b> в день или <b class="y">${money(Math.ceil(left/days*7))}</b> в неделю.`;
  };
  ["gTarget","gCur"].forEach(id=>{const el=$("#"+id);el.oninput=()=>{el.value=fmtInput(el.value);upd();};});
  $("#gDue").onchange=upd;
  $("#gSave").onclick=()=>{
    const name=$("#gName").value.trim(), tgt=+digits($("#gTarget"))||0, cur=+digits($("#gCur"))||0;
    if(!name){toast("Введи название");return;}
    if(!tgt){toast("Укажи сумму цели");return;}
    S.goals.push({id:uid(),name,target:tgt,current:cur,due:$("#gDue").value||"",created:todayISO()});
    save();closeSheet();render();celebrate("🎯");toast("Цель создана");
  };
}
function openGoalDetail(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;
  const pct=g.target?Math.min(100,Math.round(g.current/g.target*100)):0;
  const left=Math.max(0,g.target-g.current);
  const days=g.due?Math.max(1,daysBetween(todayISO(),g.due)):0;
  const fc=goalForecast(g);
  openSheet(`
    <h2>${esc(g.name)}</h2>
    <div class="hero" style="padding:20px;margin-bottom:14px">
      <div class="lbl">Накоплено</div>
      <div class="bal y" style="font-size:clamp(26px,9vw,36px)">${fmt(g.current)} <span class="cur">/ ${fmt(g.target)} ₸</span></div>
      <div class="bar gold" style="margin-top:14px"><i style="width:${pct}%"></i></div>
      <div class="sub" style="margin-top:8px">${pct}% · осталось ${money(left)}</div>
    </div>
    <div class="card" style="padding:14px;margin-bottom:14px">
      ${g.due?`<div class="stat"><span class="k">Желаемая дата</span><span class="v">${ruDateFull(g.due)}</span></div>
      <div class="stat"><span class="k">Нужно в день</span><span class="v y">${money(Math.ceil(left/days))}</span></div>
      <div class="stat"><span class="k">Нужно в неделю</span><span class="v y">${money(Math.ceil(left/days*7))}</span></div>`:""}
      ${fc?`<div class="stat"><span class="k">📈 Прогноз</span><span class="v" style="font-size:13px;font-weight:600;text-align:right;max-width:60%">${fc}</span></div>`:""}
    </div>
    <div class="field"><label>Пополнить цель, ₸</label>
      <input class="inp num" id="gAdd" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0"></div>
    <button class="btn gold" id="gAddBtn" style="margin-bottom:10px">Добавить к цели</button>
    <button class="btn danger" id="gDel">Удалить цель</button>
    <button class="btn ghost" id="gClose" style="margin-top:10px">Закрыть</button>
  `);
  const el=$("#gAdd"); el.oninput=()=>el.value=fmtInput(el.value);
  $("#gAddBtn").onclick=()=>{
    const a=+el.value.replace(/\D/g,"")||0; if(!a){toast("Введи сумму");return;}
    g.current+=a; save(); closeSheet(); render();
    if(g.current>=g.target){celebrate("🎉");toast("Цель достигнута! 🎉");}else toast("Пополнено на "+money(a));
  };
  $("#gDel").onclick=()=>{if(!confirm("Удалить цель?"))return;S.goals=S.goals.filter(x=>x.id!==id);save();closeSheet();render();};
  $("#gClose").onclick=closeSheet;
}
/* прогноз по реальному темпу накоплений за последние 60 дней */
function goalForecast(g){
  const left=Math.max(0,g.target-g.current); if(!left)return "Цель достигнута 🎉";
  const since=new Date(Date.now()-60*864e5).toISOString().slice(0,10);
  const list=S.transactions.filter(t=>t.date>=since);
  const t=totals(list); const net=t.inc-t.exp;
  if(net<=0)return "При текущем темпе накопить не получится — расходы выше доходов.";
  const perDay=net/60, days=Math.ceil(left/perDay);
  if(days>2000)return "При текущем темпе цель очень далеко.";
  const d=new Date(Date.now()+days*864e5);
  return `При текущем темпе (${money(Math.round(perDay))}/день) цель будет достигнута примерно ${ruDateFull(d.toISOString().slice(0,10))}.`;
}

/* ---------- БЮДЖЕТЫ ---------- */
function openBudgets(){
  const b=S.budgets||{};
  openSheet(`
    <h2>Бюджеты на месяц</h2>
    <div class="help" style="margin-bottom:14px">Задай лимит по категориям. Пустое поле — без лимита.</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      ${EXP_CATS.map(([c,em])=>`
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:130px;font-size:13.5px">${em} ${c}</span>
          <input class="inp num" data-bud="${esc(c)}" type="text" inputmode="numeric" autocomplete="off"
            enterkeyhint="done" placeholder="—" value="${b[c]?fmt(b[c]):""}" style="flex:1;padding:10px">
        </div>`).join("")}
    </div>
    <button class="btn" id="budSave">Сохранить</button>
    <button class="btn ghost" id="budClose" style="margin-top:10px">Отмена</button>
  `);
  document.querySelectorAll("[data-bud]").forEach(i=>i.oninput=()=>i.value=fmtInput(i.value));
  $("#budSave").onclick=()=>{
    const nb={};
    document.querySelectorAll("[data-bud]").forEach(i=>{const v=+i.value.replace(/\D/g,"")||0;if(v)nb[i.dataset.bud]=v;});
    S.budgets=nb;save();closeSheet();render();toast("Бюджеты сохранены");
  };
  $("#budClose").onclick=closeSheet;
}

/* ---------- РЕГУЛЯРНЫЕ ПЛАТЕЖИ ---------- */
function upcomingBlock(){
  const rs=S.recurring||[];
  if(!rs.length)return "";
  const withNext=rs.map(r=>({r,next:nextDue(r)})).sort((a,b)=>a.next<b.next?-1:1).slice(0,4);
  return `<div class="section-title" style="display:flex;justify-content:space-between">📄 Предстоящие платежи <span class="link" data-act="rec-new">＋</span></div>
  <div class="card" style="padding:6px 14px">
    ${withNext.map(({r,next})=>{
      const dd=daysBetween(todayISO(),next);
      return `<div class="row">
        <div class="av">${EMO[r.category]||"📄"}</div>
        <div class="t"><div class="name">${esc(r.name)}</div>
          <div class="meta">${r.period==="month"?"каждый месяц":r.period==="week"?"каждую неделю":"каждый год"} · ${dd<=0?"сегодня":"через "+dd+" "+plural(dd,"день","дня","дней")}</div></div>
        <div class="amt r">−${fmt(r.amount)}</div>
      </div>`;}).join("")}
  </div>`;
}
function nextDue(r){
  const t=new Date(todayISO()+"T00:00:00");
  if(r.period==="week"){const d=new Date(t);const add=((r.day-d.getDay())+7)%7;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10);}
  const d=new Date(t.getFullYear(),t.getMonth(),Math.min(r.day||1,28));
  if(d<t)d.setMonth(d.getMonth()+(r.period==="year"?12:1));
  return d.toISOString().slice(0,10);
}
function openRecurring(){
  openSheet(`
    <h2>Регулярный платёж</h2>
    <div class="field"><label>Название</label><input class="inp" id="rName" placeholder="Напр. Интернет"></div>
    <div class="field"><label>Сумма, ₸</label><input class="inp num" id="rAmt" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="5 000"></div>
    <div class="field"><label>Категория</label><select class="inp" id="rCat">${EXP_CATS.map(([c,em])=>`<option value="${c}">${em} ${c}</option>`).join("")}</select></div>
    <div class="split2">
      <div class="field"><label>Период</label><select class="inp" id="rPer"><option value="month">Каждый месяц</option><option value="week">Каждую неделю</option><option value="year">Каждый год</option></select></div>
      <div class="field"><label>Число / день</label><input class="inp num" id="rDay" type="text" inputmode="numeric" autocomplete="off" placeholder="27"></div>
    </div>
    ${(S.recurring||[]).length?`<div class="section-title" style="margin-top:6px">Уже добавлены</div>
    <div class="card" style="padding:6px 14px;margin-bottom:14px">${S.recurring.map(r=>`
      <div class="row"><div class="av">${EMO[r.category]||"📄"}</div>
      <div class="t"><div class="name">${esc(r.name)}</div><div class="meta">${money(r.amount)}</div></div>
      <button class="icon-btn" data-act="rec-del" data-id="${r.id}" style="width:32px;height:32px">✕</button></div>`).join("")}</div>`:""}
    <button class="btn" id="rSave">Добавить</button>
    <button class="btn ghost" id="rClose" style="margin-top:10px">Закрыть</button>
  `);
  $("#rAmt").oninput=()=>$("#rAmt").value=fmtInput($("#rAmt").value);
  $("#rDay").oninput=()=>$("#rDay").value=$("#rDay").value.replace(/\D/g,"").slice(0,2);
  document.querySelectorAll('#sheet [data-act="rec-del"]').forEach(b=>b.onclick=()=>delRecurring(b.dataset.id));
  $("#rSave").onclick=()=>{
    const name=$("#rName").value.trim(), amt=+$("#rAmt").value.replace(/\D/g,"")||0;
    if(!name||!amt){toast("Заполни название и сумму");return;}
    S.recurring.push({id:uid(),name,amount:amt,category:$("#rCat").value,period:$("#rPer").value,day:+$("#rDay").value||1});
    save();closeSheet();render();toast("Платёж добавлен");
  };
  $("#rClose").onclick=closeSheet;
}
function delRecurring(id){S.recurring=(S.recurring||[]).filter(r=>r.id!==id);save();closeSheet();render();toast("Удалено");}

/* ---------- БЫСТРЫЙ РАСХОД ---------- */
function quickAdd(cat){
  openTx("expense");
  draft.category=cat;
  renderTxSheet();
}

/* ---------- РЕЗЕРВНАЯ КОПИЯ ---------- */
function openBackup(){
  const json=JSON.stringify(S);
  const size=(new Blob([json]).size/1024).toFixed(1);
  openSheet(`
    <h2>Резервная копия</h2>
    <div class="card" style="padding:14px;margin-bottom:14px">
      <div class="stat"><span class="k">Операций</span><span class="v">${S.transactions.length}</span></div>
      <div class="stat"><span class="k">Челленджей</span><span class="v">${S.challenges.length}</span></div>
      <div class="stat"><span class="k">Целей</span><span class="v">${(S.goals||[]).length}</span></div>
      <div class="stat"><span class="k">Размер копии</span><span class="v">${size} КБ</span></div>
    </div>
    <button class="btn gold" id="bkExport" style="margin-bottom:10px">⬇️ Скачать копию (JSON)</button>
    <label class="btn ghost" style="margin-bottom:10px">⬆️ Восстановить из файла
      <input type="file" id="bkFile" accept="application/json,.json" style="display:none"></label>
    <div class="field"><label>Или скопируй данные вручную</label>
      <textarea class="inp" id="bkText" rows="4" readonly style="font-size:11px">${esc(json.slice(0,100000))}</textarea></div>
    <button class="btn ghost" id="bkCopy">📋 Скопировать</button>
    <div id="bkStatus" class="help" style="margin-top:12px"></div>
  `);
  $("#bkExport").onclick=()=>{
    try{
      const b=new Blob([json],{type:"application/json"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download="kopilka-backup-"+todayISO()+".json";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      $("#bkStatus").textContent="Файл сохранён. Если загрузка не началась — скопируй данные из поля ниже.";
    }catch(e){$("#bkStatus").textContent="Скачивание недоступно — скопируй данные из поля ниже.";}
  };
  $("#bkCopy").onclick=async()=>{
    try{await navigator.clipboard.writeText(json);toast("Скопировано");}
    catch(e){const t=$("#bkText");t.removeAttribute("readonly");t.select();document.execCommand("copy");t.setAttribute("readonly","");toast("Скопировано");}
  };
  $("#bkFile").onchange=(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      let data=null;
      try{data=JSON.parse(fr.result);}catch(_){ $("#bkStatus").innerHTML='<span class="r">Файл повреждён — это не копия Копилки.</span>'; return; }
      /* СНАЧАЛА проверяем структуру, только потом заменяем данные */
      if(!data||typeof data!=="object"||!Array.isArray(data.transactions)){
        $("#bkStatus").innerHTML='<span class="r">В файле нет операций — восстановление отменено.</span>';return;
      }
      const n=data.transactions.length, g=(data.goals||[]).length, c=(data.challenges||[]).length;
      if(!confirm(`Восстановить копию?\n\nОпераций: ${n}\nЧелленджей: ${c}\nЦелей: ${g}\n\nТекущие данные будут заменены.`))return;
      const backupNow=JSON.stringify(S);
      try{
        S=migrate(Object.assign(fresh(),data));
        save();closeSheet();applyTheme();TAB="home";render();
        celebrate("✅");toast("Восстановлено операций: "+S.transactions.length);
      }catch(err){
        try{S=JSON.parse(backupNow);save();}catch(_){}
        $("#bkStatus").innerHTML='<span class="r">Не удалось восстановить — прежние данные сохранены.</span>';
      }
    };
    fr.readAsText(f);
  };
}

/* ---------- ЕЖЕНЕДЕЛЬНОЕ НАПОМИНАНИЕ О ВЫПИСКЕ ---------- */
function checkStatementReminder(){
  const last=S.settings.lastStatement;
  if(!last)return;
  const days=daysBetween(last,todayISO());
  if(days<7)return;
  const key="stmt_notif_"+todayISO();
  if(localStorage.getItem(key))return;
  if("Notification" in window && Notification.permission==="granted"){
    try{
      new Notification("Копилка · пора обновить аналитику",{body:"Загрузи свежую выписку Kaspi за последнюю неделю."});
      localStorage.setItem(key,"1");
    }catch(e){}
  }
}

/* ---------- СТАРТ ПРИЛОЖЕНИЯ (после загрузки всех модулей) ---------- */
try{
  render();
  welcome();
  checkReminders();
  setInterval(checkReminders,60000);
}catch(e){
  /* даже при ошибке приложение не должно оставаться пустым */
  try{TAB="home";document.getElementById("view").innerHTML=
    '<div class="card" style="margin-top:16px">'+
    '<div class="empty"><div class="em">⚠️</div><div style="font-weight:700;color:var(--muted)">Не удалось отрисовать экран</div>'+
    '<div style="font-size:13px;margin-top:4px">'+String(e.message||e)+'</div></div></div>';}catch(_){}
}
</script>
