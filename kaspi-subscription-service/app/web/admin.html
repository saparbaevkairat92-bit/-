<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка — подтверждение платежей</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; }
    input { padding:10px; border:1px solid #ccc; border-radius:8px; }
    table { width:100%; border-collapse: collapse; margin-top:16px; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #eee; font-size:14px; }
    .amount { font-weight:700; color:#f14635; }
    button { border:0; border-radius:6px; padding:8px 12px; cursor:pointer; color:#fff; }
    .ok { background:#16a34a; } .no { background:#999; }
    .bar { display:flex; gap:8px; align-items:center; }
  </style>
</head>
<body>
  <h1>Ожидают подтверждения</h1>
  <div class="bar">
    <input id="admin" placeholder="X-Admin-Key" style="flex:1" />
    <button class="ok" onclick="load()">Обновить</button>
  </div>
  <p class="muted">Сверьте сумму с поступлением в приложении Kaspi и нажмите «Подтвердить».</p>
  <table>
    <thead><tr><th>Сумма</th><th>Код</th><th>Клиент</th><th>План</th><th>Создан</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
function hdr() { return { "X-Admin-Key": document.getElementById("admin").value, "Content-Type":"application/json" }; }

async function load() {
  const r = await fetch("/v1/admin/payments", { headers: hdr() });
  if (!r.ok) return alert("Ошибка: " + r.status);
  const rows = await r.json();
  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  rows.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="amount">${p.amount_kzt} ₸</td>
      <td>${p.reference_code || "—"}</td>
      <td>${p.customer_external_id}<br><small>${p.customer_phone}</small></td>
      <td>${p.plan_name}</td>
      <td><small>${new Date(p.created_at).toLocaleString()}</small></td>
      <td>
        <button class="ok" onclick="confirmPay('${p.payment_id}')">Подтвердить</button>
        <button class="no" onclick="rejectPay('${p.payment_id}')">Отклонить</button>
      </td>`;
    tb.appendChild(tr);
  });
  if (!rows.length) tb.innerHTML = "<tr><td colspan=6>Нет ожидающих платежей</td></tr>";
}

async function confirmPay(id) {
  const r = await fetch(`/v1/admin/payments/${id}/confirm`, { method:"POST", headers: hdr() });
  if (!r.ok) return alert("Ошибка: " + await r.text());
  load();
}
async function rejectPay(id) {
  if (!confirm("Отклонить платёж?")) return;
  const r = await fetch(`/v1/admin/payments/${id}/reject`, { method:"POST", headers: hdr() });
  if (!r.ok) return alert("Ошибка: " + r.status);
  load();
}
</script>
</body>
</html>
