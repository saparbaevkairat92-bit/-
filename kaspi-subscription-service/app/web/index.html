<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оформление подписки</title>
  <style>
    :root { --kaspi:#f14635; }
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color:#1a1a1a; }
    h1 { font-size: 22px; }
    .plan { border:1px solid #e2e2e2; border-radius:12px; padding:16px; margin:12px 0; cursor:pointer; }
    .plan:hover { border-color: var(--kaspi); }
    .plan.sel { border-color: var(--kaspi); background:#fff5f4; }
    .plan b { font-size:18px; }
    input { width:100%; padding:10px; margin:6px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
    button { background:var(--kaspi); color:#fff; border:0; padding:12px 18px; border-radius:8px; font-size:16px; cursor:pointer; width:100%; }
    .pay-link { display:block; text-align:center; background:var(--kaspi); color:#fff; text-decoration:none; padding:14px; border-radius:8px; margin-top:12px; font-size:18px; }
    .box { background:#f6f6f6; border-radius:12px; padding:16px; margin-top:16px; }
    .amount { font-size:28px; font-weight:700; color:var(--kaspi); }
    .muted { color:#666; font-size:14px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>Выберите подписку</h1>

  <!-- Ключ проекта. На реальном сайте можно зашить в код:
       window.PROJECT_KEY = "..."; (это безопасно — без админ-ключа активировать нельзя) -->
  <input id="key" placeholder="X-API-Key проекта" />

  <div id="plans"></div>

  <div id="form" class="hidden">
    <input id="external_id" placeholder="Ваш email или ID" />
    <input id="phone" placeholder="+77001234567" />
    <button onclick="subscribe()">Оформить и получить счёт</button>
  </div>

  <div id="result" class="box hidden">
    <div class="muted">К оплате ровно:</div>
    <div class="amount"><span id="amount"></span> ₸</div>
    <p id="instructions" class="muted"></p>
    <a id="paylink" class="pay-link" target="_blank" rel="noopener">Оплатить в Kaspi</a>
    <p class="muted" id="refnote"></p>
    <p class="muted" id="statusnote"></p>
  </div>

<script>
const API = ""; // тот же origin
let selectedPlan = null;
let lastSubId = null;

function keyHeader() {
  const k = document.getElementById("key").value || window.PROJECT_KEY || "";
  return { "X-API-Key": k, "Content-Type": "application/json" };
}

async function loadPlans() {
  const key = document.getElementById("key").value || window.PROJECT_KEY;
  if (!key) return;
  const r = await fetch(API + "/v1/public/plans", { headers: keyHeader() });
  if (!r.ok) return;
  const plans = await r.json();
  const box = document.getElementById("plans");
  box.innerHTML = "";
  plans.forEach(p => {
    const el = document.createElement("div");
    el.className = "plan";
    el.innerHTML = `<b>${p.name}</b><br>${p.amount_kzt} ₸ / ${p.interval_days} дней`;
    el.onclick = () => {
      document.querySelectorAll(".plan").forEach(x => x.classList.remove("sel"));
      el.classList.add("sel");
      selectedPlan = p.id;
      document.getElementById("form").classList.remove("hidden");
    };
    box.appendChild(el);
  });
}

async function subscribe() {
  if (!selectedPlan) return alert("Выберите план");
  const body = {
    plan_id: selectedPlan,
    external_id: document.getElementById("external_id").value,
    phone: document.getElementById("phone").value,
  };
  const r = await fetch(API + "/v1/public/subscribe", {
    method: "POST", headers: keyHeader(), body: JSON.stringify(body),
  });
  if (!r.ok) return alert("Ошибка: " + (await r.text()));
  const d = await r.json();
  lastSubId = d.subscription_id;
  document.getElementById("amount").textContent = d.payment.amount_kzt;
  document.getElementById("instructions").textContent = d.payment.instructions;
  const link = document.getElementById("paylink");
  if (d.payment.payment_url) { link.href = d.payment.payment_url; link.classList.remove("hidden"); }
  else { link.classList.add("hidden"); }
  document.getElementById("refnote").textContent =
    d.payment.reference_code ? ("Код платежа: " + d.payment.reference_code) : "";
  document.getElementById("result").classList.remove("hidden");
  pollStatus();
}

async function pollStatus() {
  if (!lastSubId) return;
  const r = await fetch(API + `/v1/public/subscriptions/${lastSubId}/status`, { headers: keyHeader() });
  if (r.ok) {
    const s = await r.json();
    document.getElementById("statusnote").textContent =
      s.is_active ? "✅ Оплата получена, подписка активна!" : "⏳ Ожидаем оплату…";
    if (s.is_active) return;
  }
  setTimeout(pollStatus, 5000);
}

document.getElementById("key").addEventListener("change", loadPlans);
window.addEventListener("load", loadPlans);
</script>
</body>
</html>
